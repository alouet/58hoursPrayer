      return `<div class="timeline ${compact ? 'compact' : ''}">${groups.map((g) => `
        <div class="tl-day"><p class="tl-date">${U.fmtDate(g.ts, { weekday: compact ? undefined : 'long', month: 'long', day: 'numeric' })} <span class="muted tnum">· ${U.hm(g.items.reduce((a, s) => a + s.durationMs, 0))}</span></p>
          <ol>${g.items.map((s) => `<li class="tl-item">
            <span class="tl-ico" aria-hidden="true">${U.icon(P.mode(s.mode).icon)}</span>
            <div class="tl-main"><p class="tl-title"><span class="tnum">${U.fmtTime(s.start)}–${U.fmtTime(s.end || s.start + s.durationMs)}</span> <strong class="tnum">${U.hm(s.durationMs)}</strong></p>
              <p class="tl-sub">“${U.esc(s.title || P.modeLabel(s.mode))}” <span class="muted">· ${U.esc(P.modeLabel(s.mode))}${s.source === 'manual' ? ' · logged' : ''}</span></p>
              ${!compact && s.notes ? `<p class="tl-notes">${U.esc(s.notes)}</p>` : ''}
              ${!compact && (s.sown || []).length ? `<p class="tl-tags">${s.sown.map((t) => `<span class="tag">${U.esc(t)}</span>`).join('')}</p>` : ''}</div>
            ${compact ? '' : `<div class="tl-actions"><button class="icon-btn sm" data-edit-session="${s.id}" aria-label="Edit session">${U.icon('edit')}</button><button class="icon-btn sm" data-del-session="${s.id}" aria-label="Delete session">${U.icon('trash')}</button></div>`}
          </li>`).join('')}</ol></div>`).join('')}</div>`;
    },

    bind() {
      U.on(document.body, 'click', '[data-edit-session]', (e, b) => P.editSession(b.dataset.editSession));
      U.on(document.body, 'click', '[data-del-session]', async (e, b) => {
        const s = M.Storage.getSessions().find((x) => x.id === b.dataset.delSession); if (!s) return;
        const ok = await U.confirm('Delete this session?', U.hm(s.durationMs) + ' on ' + U.fmtDate(s.start) + ' will be removed from your journey.', { ok: 'Delete session', danger: true });
        if (ok) { M.Storage.deleteSession(s.id); U.toast('Session deleted.'); M.App.refresh(); }
      });
      // live display refresh
      M.Timer.subscribe((type) => {
        const a = M.Timer.active;
        const el = M.Timer.elapsed();
        U.$$('[data-live-time]').forEach((n) => { n.textContent = U.hms(el); });
        P.updateLivePill();
        if (type === 'planned') { if (M.Sound) M.Sound.chime(); U.toast('Your meditation time is complete. Stay as long as you like.'); }
        if (a && !liveCompletionFired) {
          const g = M.Storage.getGoal(a.goalId);
          if (g && M.Goals.isTimeBased(g) && !M.state.meta.completedGoals[g.id]) {
            const p = M.Goals.progress(g, el);
            if (p.complete) {
              liveCompletionFired = true;
              M.state.meta.completedGoals[g.id] = Date.now(); M.Storage.touch('meta');
              M.Viz.completion(g);
            }
          }
        }
        if (type === 'start' || type === 'end' || type === 'restore' || type === 'pause' || type === 'resume') P.syncFocusControls();
      });
    },

    /** Floating pill shown when a session runs outside the prayer room */
    updateLivePill() {
      const pill = U.$('#live-pill'); if (!pill) return;
      const a = M.Timer.active;
      const inFocus = !!U.$('#focus');
      pill.hidden = !a || inFocus;
      if (a) { U.$('.lp-time', pill).textContent = U.hms(M.Timer.elapsed()); U.$('.lp-state', pill).textContent = a.paused ? 'Paused' : 'Sowing'; pill.classList.toggle('paused', a.paused); }
    },

    /* ------------------------------------------------------------------ */
    start(opts) {
      if (M.Timer.isActive) { P.openFocus(); return; }
      liveCompletionFired = false;
      M.Timer.start(opts);
      P.openFocus(true);
      if (M.Sound && M.state.settings.sound !== 'silent') M.Sound.play(M.state.settings.sound);
    },

    openFocus(fresh) {
      const a = M.Timer.active; if (!a) return;
      if (U.$('#focus')) return;
      const s = M.state.settings;
      const verse = (a.verseRef && M.Scripture.byId(a.verseRef)) || M.Scripture.today();
      const decl = M.Declarations.today();
      const el = document.createElement('div');
      el.id = 'focus';
      el.className = 'focus bg-' + s.background;
      el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Prayer room');
      el.innerHTML = `
        <canvas class="focus-bg" aria-hidden="true"></canvas>
        <div class="focus-top">
          <span class="focus-mode">${U.icon(P.mode(a.mode).icon)} ${U.esc(a.title || P.modeLabel(a.mode))}</span>
          <div class="row gap-s">
            <button class="icon-btn light" data-f="sound" aria-label="Ambient sound">${U.icon(M.Sound && M.Sound.playing ? 'sound' : 'mute')}</button>
            <button class="icon-btn light ${a.keepAwake ? 'on' : ''}" data-f="awake" aria-pressed="${!!a.keepAwake}" aria-label="Keep screen awake">${U.icon('sun')}</button>
            <button class="icon-btn light" data-f="note" aria-label="Write a note">${U.icon('journal')}</button>
            <button class="icon-btn light" data-f="fs" aria-label="Full screen">${U.icon('expand')}</button>
            <button class="icon-btn light" data-f="min" aria-label="Leave the prayer room (timer keeps running)">${U.icon('minimize')}</button>
          </div>
        </div>
        <div class="focus-center">
          <p class="focus-prompt" aria-live="polite"></p>
          <p class="focus-time tnum" data-live-time>${U.hms(M.Timer.elapsed())}</p>
          <p class="focus-sub">You are sowing.</p>
          <div class="focus-controls">
            <div class="adj"><button class="btn light-outline adj-btn" data-f="minus15" aria-label="Remove 15 minutes">−15</button><button class="btn light-outline adj-btn" data-f="minus5" aria-label="Remove 5 minutes">−5</button></div>
            <button class="btn round light" data-f="toggle" aria-label="Pause">${U.icon('pause')}</button>
            <div class="adj"><button class="btn light-outline adj-btn" data-f="plus5" aria-label="Add 5 minutes">+5</button><button class="btn light-outline adj-btn" data-f="plus15" aria-label="Add 15 minutes">+15</button></div>
          </div>
          <p class="adj-hint">minutes</p>
          ${M.state.settings.vision.showInPrayer ? `<div class="focus-va"><p class="kind light">Vision account</p><p class="focus-va-amt tnum" data-vision-total>${U.esc(M.Vision.fmt(M.Vision.value(), M.Vision.home()))}</p><div class="va-live" aria-live="off"></div></div>` : ''}
          <button class="btn end-btn" data-f="end">${U.icon('stop')} End session</button>
        </div>
        <div class="focus-words">
          <figure class="focus-verse"><p class="kind light">Scripture</p><blockquote>${U.esc(verse.text)}</blockquote><figcaption>${U.esc(verse.ref)} ${U.esc(verse.v || '')}</figcaption></figure>
          <figure class="focus-decl"><p class="kind light">Personal declaration</p><p>“${U.esc(decl.text)}”</p></figure>
          <div class="focus-seed"><canvas aria-label="Your faith journey"></canvas><p class="small"><span data-focus-stage></span></p></div>
        </div>
        <p class="focus-stay">Stay here.</p>
        <p class="focus-wake small" data-wake-note></p>`;
      document.body.appendChild(el);
      document.body.classList.add('focus-open');
      requestAnimationFrame(() => el.classList.add('in'));
      P.drawRoom(U.$('.focus-bg', el), s.background);
      const g = M.Storage.getGoal(a.goalId) || M.Goals.active();
      M.Viz.mountTree(U.$('.focus-seed canvas', el), () => M.Goals.progress(g, M.Timer.elapsed()).pct);
      const stageEl = U.$('[data-focus-stage]', el);

      // prompts loop
      const promptEl = U.$('.focus-prompt', el); const subEl = U.$('.focus-sub', el);
      let lastPrompt = null, lastEnc = 0;
      const promptTick = () => {
        if (!el.isConnected || !M.Timer.active) return;
        const sec = M.Timer.elapsed() / 1000;
        const pr = PROMPTS.find((p) => sec >= p.at && sec < p.at + p.dur && (M.state.settings.prompts || p.at < 10));
        const txt = pr ? pr.text : '';
        if (txt !== lastPrompt) {
          lastPrompt = txt;
          promptEl.classList.remove('on');
          setTimeout(() => { promptEl.textContent = txt; promptEl.classList.toggle('big', !!(pr && pr.big)); if (txt) promptEl.classList.add('on'); }, 350);
        }
        // gentle encouragement every 3 minutes
        if (!M.Timer.isPaused && sec - lastEnc > 180 && sec > 60) { lastEnc = sec; subEl.textContent = M.Declarations.encouragement(); }
        if (M.Timer.isPaused) subEl.textContent = 'Paused. Take your time.';
        else if (subEl.textContent === 'Paused. Take your time.') subEl.textContent = 'You are sowing.';
        stageEl.textContent = M.Viz.stage(M.Goals.progress(g, M.Timer.elapsed()).pct).name + ' · your faith journey';
        setTimeout(promptTick, 1000);
      };
      promptTick();

      U.on(el, 'click', '[data-f]', async (e, b) => {
        const f = b.dataset.f;
        if (f === 'toggle') M.Timer.toggle();
        if (f === 'plus5') { M.Timer.addTime(5 * 60000); U.toast('5 minutes added.'); }
        if (f === 'plus15') { M.Timer.addTime(15 * 60000); U.toast('15 minutes added.'); }
        if (f === 'minus5' || f === 'minus15') {
          const want = f === 'minus5' ? 5 : 15;
          const done = -M.Timer.addTime(-want * 60000);
          U.toast(done < want * 60000 - 1000 ? 'Timer set back to ' + U.hms(M.Timer.elapsed()) + '.' : want + ' minutes removed.');
        }
        if (f === 'end') P.finish();
        if (f === 'min') P.closeFocus();
        if (f === 'fs') M.Viz.requestFullscreen(el);
        if (f === 'sound') { if (!M.Sound) return; if (M.Sound.playing) M.Sound.stop(); else M.Sound.play(M.state.settings.sound === 'silent' ? 'ambience' : M.state.settings.sound); b.innerHTML = U.icon(M.Sound.playing ? 'sound' : 'mute'); }
        if (f === 'awake') {
          const on = !M.Timer.active.keepAwake;
          const ok = await M.Timer.setKeepAwake(on);
          b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
          U.toast(on ? (ok ? 'Screen awake enabled where supported.' : 'This device did not allow keeping the screen awake. The timer stays accurate anyway.') : 'Screen may sleep. The timer keeps counting.');
        }
        if (f === 'note') P.quickNote();
      });
      el.addEventListener('keydown', (e) => {
        if (e.target.matches('input,textarea')) return;
        if (e.key === ' ') { e.preventDefault(); M.Timer.toggle(); }
        if (e.key === 'Escape') P.closeFocus();
      });
      P.syncFocusControls();
      el.tabIndex = -1; el.focus();
      P.updateLivePill();
    },
    syncFocusControls() {
      const el = U.$('#focus'); if (!el) return;
      const t = U.$('[data-f="toggle"]', el);
      if (!M.Timer.active) return;
      t.innerHTML = U.icon(M.Timer.isPaused ? 'play' : 'pause');
      t.setAttribute('aria-label', M.Timer.isPaused ? 'Resume' : 'Pause');
      el.classList.toggle('paused', M.Timer.isPaused);
      const w = U.$('[data-wake-note]', el);
      if (w) w.textContent = M.Timer.active.keepAwake ? (M.Timer.wakeOn ? 'Screen awake enabled where supported.' : (M.Timer.wakeSupported ? '' : 'The timer stays accurate even if the screen sleeps.')) : '';
    },
    closeFocus() {
      const el = U.$('#focus'); if (!el) return;
      el.classList.remove('in'); document.body.classList.remove('focus-open');
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      setTimeout(() => { el.remove(); P.updateLivePill(); }, 400);
      M.App.refresh();
    },
    quickNote() {
      const a = M.Timer.active; if (!a) return;
      const m = U.modal(`<h3 class="modal-title">Write while you listen</h3>
        <label class="field"><span>This note is attached to the session when you end it.</span><textarea id="qn" rows="6" placeholder="Instructions, revelations, prayers…">${U.esc(a.note || '')}</textarea></label>
        <div class="row end gap"><button class="btn primary" data-qn-save>Keep note</button></div>`, { label: 'Session note' });
      U.$('[data-qn-save]', m).onclick = () => { a.note = U.$('#qn', m).value; M.Storage.saveActive(a); U.closeModal(); U.toast('Note kept with this session.'); };
    },

    /** Animated prayer-room backdrop (always dark and cinematic) */
    drawRoom(cv, bg) {
      const rnd = U.rng(7); const stars = Array.from({ length: 140 }, () => ({ x: rnd(), y: rnd(), r: rnd() * 1.3 + 0.2, p: rnd() * 6 }));
      M.Viz.animate(cv, (ctx, W, H, t) => {
        const A = M.Viz.rgba; const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#d4ae62';
        const grad = (stops) => { const g = ctx.createLinearGradient(0, 0, 0, H); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
        if (bg === 'night') {
          grad([[0, '#03050c'], [1, '#0b1226']]);
          stars.forEach((s) => { ctx.fillStyle = 'rgba(235,240,255,' + (0.25 + 0.45 * (Math.sin(t * 0.8 + s.p) + 1) / 2) + ')'; ctx.beginPath(); ctx.arc(s.x * W, s.y * H * 0.85, s.r, 0, 6.28); ctx.fill(); });
        } else if (bg === 'mountain') {
          grad([[0, '#0a0f1f'], [0.6, '#1a2238'], [1, '#2a2a3a']]);
          stars.slice(0, 50).forEach((s) => { ctx.fillStyle = 'rgba(235,240,255,0.35)'; ctx.fillRect(s.x * W, s.y * H * 0.4, 1, 1); });
          [[0.55, '#141b2e', 0.004, 60], [0.66, '#10162a', 0.007, 45], [0.78, '#0a0f1f', 0.011, 30]].forEach(([base, col, f, amp], i) => {
            ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
            for (let x = 0; x <= W; x += 6) ctx.lineTo(x, H * base - Math.abs(Math.sin(x * f + i) * amp + Math.sin(x * f * 2.7 + i * 3) * amp * 0.4));
            ctx.lineTo(W, H); ctx.fill();
          });
          ctx.fillStyle = 'rgba(200,210,230,' + (0.04 + Math.sin(t * 0.2) * 0.02) + ')'; ctx.fillRect(0, H * 0.7, W, H * 0.3);
        } else if (bg === 'ocean') {
          grad([[0, '#050b18'], [0.55, '#0d1a33'], [0.56, '#07101f'], [1, '#040812']]);
          const g = ctx.createRadialGradient(W / 2, H * 0.55, 0, W / 2, H * 0.55, W * 0.4); g.addColorStop(0, 'rgba(180,200,240,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          for (let k = 0; k < 22; k++) { const y = H * 0.57 + k * k * 0.9; ctx.strokeStyle = 'rgba(170,195,235,' + (0.05 + 0.1 * (1 - k / 22)) + ')'; ctx.beginPath(); for (let x = 0; x <= W; x += 8) ctx.lineTo(x, y + Math.sin(x * 0.02 + t * (0.6 + k * 0.03) + k) * (1 + k * 0.25)); ctx.stroke(); }
        } else if (bg === 'garden') {
          grad([[0, '#040b08'], [1, '#0c1f16']]);
          stars.slice(0, 40).forEach((s, i) => { const x = (s.x * W + Math.sin(t * 0.3 + s.p) * 30), y = (s.y * H + Math.cos(t * 0.25 + s.p) * 20); const a = 0.3 + 0.5 * (Math.sin(t * 1.3 + s.p) + 1) / 2; ctx.fillStyle = 'rgba(230,220,140,' + a * 0.25 + ')'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.28); ctx.fill(); ctx.fillStyle = 'rgba(245,235,170,' + a + ')'; ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 6.28); ctx.fill(); });
          ctx.fillStyle = '#06130d'; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 10) ctx.lineTo(x, H * 0.86 - Math.abs(Math.sin(x * 0.05)) * 18); ctx.lineTo(W, H); ctx.fill();
        } else if (bg === 'sunrise') {
          const rise = Math.min(1, t / 240);
          grad([[0, '#0b0f24'], [0.55, '#3a2a45'], [0.85, '#8a5540'], [1, '#c98a52']]);
          const sy = H * (0.95 - rise * 0.15);
          const g = ctx.createRadialGradient(W / 2, sy, 0, W / 2, sy, W * 0.6); g.addColorStop(0, 'rgba(255,210,150,0.55)'); g.addColorStop(0.2, 'rgba(255,180,120,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = 'rgba(255,225,180,0.9)'; ctx.beginPath(); ctx.arc(W / 2, sy, Math.min(W, H) * 0.06, 0, 6.28); ctx.fill();
          ctx.fillStyle = '#120d1a'; ctx.fillRect(0, H * 0.93, W, H * 0.07);
        } else { // quiet room
          grad([[0, '#0d0b0a'], [1, '#1a1512']]);
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          const g = ctx.createLinearGradient(W * 0.75, 0, W * 0.35, H); g.addColorStop(0, 'rgba(255,220,170,0.16)'); g.addColorStop(1, 'rgba(255,220,170,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(W * 0.62, 0); ctx.lineTo(W * 0.86, 0); ctx.lineTo(W * 0.6, H); ctx.lineTo(W * 0.2, H); ctx.fill();
          stars.slice(0, 60).forEach((s) => { const x = W * (0.3 + s.x * 0.5) + Math.sin(t * 0.2 + s.p) * 10, y = (s.y * H + t * 4 * s.r) % H; ctx.fillStyle = 'rgba(255,230,190,' + (0.1 + s.r * 0.15) + ')'; ctx.fillRect(x, y, 1.2, 1.2); });
          ctx.restore();
        }
        // accent veil keeps every room tied to the chosen theme
        const v = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.55);
        v.addColorStop(0, A(acc, 0.1)); v.addColorStop(1, A(acc, 0)); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
      });
    },

    /* ------------------------------------------------------------------ */
    /** End the running session and walk through the Seed Sown experience */
    finish() {
      const a = M.Timer.active; if (!a) return;
      const g = M.Storage.getGoal(a.goalId) || M.Goals.active();
      const before = M.Goals.progress(g);
      const note = a.note || '';
      const saved = M.Timer.end();
      if (M.Sound) M.Sound.stop();
      P.closeFocus();
      if (!saved) { U.toast('That session was too short to save.'); return; }
      const after = M.Goals.progress(g);
      P.endFlow(saved, g, before, after, note);
    },

    endFlow(session, g, before, after, note) {
      const timeBased = M.Goals.isTimeBased(g);
      const el = document.createElement('div');
      el.className = 'cinema end-flow'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Session complete');
      el.innerHTML = `
        <div class="end-inner">
          <section class="end-stats">
            <p class="kind light">Session complete</p>
            <p class="end-k" data-s="1">Seed sown</p>
            <p class="end-big tnum" data-s="1">${U.hms(session.durationMs)}</p>
            <p class="end-phrase" data-s="1">You just sowed ${U.phrase(session.durationMs)}.</p>
            <p class="end-va" data-s="2"><span class="kind light">Vision account</span> <strong class="tnum">+ ${U.esc(M.Vision.fmt(M.Vision.sessionValue(session.durationMs), M.Vision.home()))}</strong></p>
            <div class="end-pair">
              <div data-s="2"><p class="end-k">Total sown</p><p class="end-mid tnum">${timeBased ? U.hms(after.doneMs) : U.esc(M.Goals.fmtValue(after))}</p></div>
              <div data-s="3"><p class="end-k">Remaining</p><p class="end-mid tnum">${timeBased ? U.hms(after.remainingMs) : U.esc(M.Goals.fmtRemaining(after))}</p></div>
            </div>
            <canvas class="end-tree" data-s="4" aria-label="Your faith journey tree"></canvas>
            <p class="end-msg" data-s="4">Another seed has been planted.</p>
          </section>
          <section class="end-form" data-s="5">
            <h2 class="end-q">What did you sow today?</h2>
            <div class="chip-row" role="group" aria-label="What did you sow">${SOWN.map((s) => `<button class="chip seed-chip" data-sown="${s}" aria-pressed="false">${U.icon('seed')} ${s}</button>`).join('')}</div>
            <h2 class="end-q">What did you receive during this time?</h2>
            <label class="sr-only" for="end-note">Journal</label>
            <textarea id="end-note" rows="4" placeholder="Write your thoughts, instructions, revelations or prayers…">${U.esc(note)}</textarea>
            <div class="chip-row" role="group" aria-label="Tags">${TAGS.map((t) => `<button class="chip sm" data-tag="${t}" aria-pressed="false">${t}</button>`).join('')}</div>
            <div class="grid2">
              <label class="field"><span>Session title</span><input id="end-title" value="${U.esc(session.title)}"></label>
              <label class="field"><span>Category</span><select id="end-mode">${MODES.map((m) => `<option value="${m.id}" ${m.id === session.mode ? 'selected' : ''}>${m.label}</option>`).join('')}</select></label>
            </div>
            <div class="row gap wrap end-actions">
              <button class="btn primary" data-end="continue">Continue</button>
              <button class="btn ghost light" data-end="journal">${U.icon('journal')} Journal</button>
              <button class="btn ghost light" data-end="journey">${U.icon('seed')} View journey</button>
            </div>
          </section>
        </div>`;
      document.body.appendChild(el); document.body.classList.add('cinema-open');
      requestAnimationFrame(() => el.classList.add('in'));
      const rm = U.reducedMotion();
      [1, 2, 3, 4, 5].forEach((n, i) => setTimeout(() => U.$$('[data-s="' + n + '"]', el).forEach((x) => x.classList.add('on')), rm ? 0 : 300 + i * 900));
      const t0 = performance.now();
      M.Viz.animate(U.$('.end-tree', el), (ctx, W, H, t) => { ctx.clearRect(0, 0, W, H); const k = U.clamp((performance.now() - t0 - 3000) / 2200, 0, 1); M.Viz.drawTree(ctx, W, H, before.pct + (after.pct - before.pct) * (rm ? 1 : k), t, {}); });
      U.on(el, 'click', '[data-sown],[data-tag]', (e, b) => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.classList.toggle('on', on); });
      U.on(el, 'click', '[data-end]', (e, b) => {
        const sown = U.$$('[data-sown].on', el).map((x) => x.dataset.sown);
        const tags = U.$$('[data-tag].on', el).map((x) => x.dataset.tag);
        const txt = U.$('#end-note', el).value.trim();
        session.sown = sown; session.tags = tags; session.notes = txt;
        session.title = U.$('#end-title', el).value.trim() || P.modeLabel(U.$('#end-mode', el).value);
        session.mode = U.$('#end-mode', el).value;
        M.Storage.saveSession(session);

/* ===== js/notifications.js ===== */
/* ==========================================================================
   notifications.js — gentle, optional reminders
   ---------------------------------------------------------------------------
   Web apps cannot schedule notifications while fully closed without a push
   server. So reminders fire while the app is open or running in the
   background, and a calendar file (.ics) is offered for reminders that
   arrive even when the app is closed. Messages are never guilt-inducing.
   ========================================================================== */
(function (M) {
  'use strict';
  const U = M.U;
  const GENTLE = ['Your prayer time is waiting.', 'Plant today’s seed.', 'Stay faithful to the journey.', 'Give God your attention.', 'Stay in His presence.'];
  let loop = null;

  const N = {
    supported: 'Notification' in window,
    permission() { return N.supported ? Notification.permission : 'unsupported'; },
    async request() {
      if (!N.supported) { U.toast('This browser does not support notifications. In-app reminders will still appear.'); return 'unsupported'; }
      try {
        const r = await Notification.requestPermission();
        if (r === 'denied') U.toast('Notifications are blocked. You can allow them in your browser settings. In-app reminders still work.', 'warn');
        return r;
      } catch (e) { return 'denied'; }
    },
    message() {
      const g = M.Goals.active();
      const left = M.Goals.dailyTargetMs(g) - M.Analytics.todayMs();
      if (left > 60000 && Math.random() < 0.5) return 'You have ' + U.hm(left) + ' remaining today.';
      return U.pick(GENTLE);
    },
    async show(body) {
      const title = 'Money Doesn’t Deserve My Time';
      if (N.permission() === 'granted') {
        try {
          const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
          if (reg) { await reg.showNotification(title, { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'mdt-reminder' }); return; }
          new Notification(title, { body }); return;
        } catch (e) { /* fall through to in-app */ }
      }
      U.toast(body);
    },
    tick() {
      const r = M.state.settings.reminders;
      if (!r || !r.enabled || M.Timer.isActive) return;
      const now = new Date();
      if (r.days && !r.days.includes(now.getDay())) return;
      const hm = U.pad(now.getHours()) + ':' + U.pad(now.getMinutes());
      const key = 'mdt.rem.' + U.dayKey(Date.now()) + '.' + hm;
      if (!(r.times || []).includes(hm)) return;
      try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) { if (N._last === key) return; N._last = key; }
      N.show(N.message());
    },
    init() { clearInterval(loop); loop = setInterval(N.tick, 20000); },
    /** Calendar file with daily recurring reminders */
    ics() {
      const r = M.state.settings.reminders;
      const d = new Date(); const ymd = d.getFullYear() + U.pad(d.getMonth() + 1) + U.pad(d.getDate());
      const days = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
      const byday = (r.days || [0, 1, 2, 3, 4, 5, 6]).map((i) => days[i]).join(',');

      U.$('[data-arrange]', root).onclick = () => { arranging = !arranging; App.dashboard(root); };
      U.$$('[data-wmove]', root).forEach((b) => b.onclick = () => App.moveWidget(b.dataset.id, +b.dataset.wmove, root));
      U.$$('[data-whide]', root).forEach((b) => b.onclick = () => { const o = App.order(); const w = o.find((x) => x.id === b.dataset.id); w.hidden = !w.hidden; M.state.meta.widgetOrder = o; M.Storage.touch('meta'); App.dashboard(root); });
      if (arranging) App.dragSort(root);
      U.$$('[data-start-quick]', root).forEach((b) => b.onclick = () => M.Prayer.start({ mode: b.dataset.startQuick || 'pray' }));
      U.$$('[data-go]', root).forEach((b) => b.onclick = () => App.go(b.dataset.go));
      U.$$('[data-open-focus]', root).forEach((b) => b.onclick = () => M.Prayer.openFocus());
      const dr = U.$('[data-reveal]', root); if (dr) dr.onclick = () => { dr.classList.add('revealed'); dr.setAttribute('aria-expanded', 'true'); };
      U.$$('[data-vision]', root).forEach((b) => b.onclick = () => M.Viz.openVision());
      U.$$('[data-globe]', root).forEach((b) => b.onclick = () => M.Viz.openGlobalFlow());
      M.Vision.countUp(root);
    },
    moveWidget(id, dir, root) {
      const o = App.order(); const i = o.findIndex((w) => w.id === id); const j = i + dir;
      if (j < 0 || j >= o.length) return;
      [o[i], o[j]] = [o[j], o[i]]; M.state.meta.widgetOrder = o; M.Storage.touch('meta'); App.dashboard(root);
      const b = U.$('[data-wmove="' + dir + '"][data-id="' + id + '"]', root); if (b && !b.disabled) b.focus();
    },
    dragSort(root) {
      let dragId = null;
      U.$$('[data-w]', root).forEach((el) => {
        el.addEventListener('dragstart', (e) => { dragId = el.dataset.w; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { /* ignore */ } });
        el.addEventListener('dragend', () => el.classList.remove('dragging'));
        el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop'); });
        el.addEventListener('dragleave', () => el.classList.remove('drop'));
        el.addEventListener('drop', (e) => {
          e.preventDefault(); el.classList.remove('drop');
          const o = App.order(); const from = o.findIndex((w) => w.id === dragId); const to = o.findIndex((w) => w.id === el.dataset.w);
          if (from < 0 || to < 0 || from === to) return;
          const [w] = o.splice(from, 1); o.splice(to, 0, w); M.state.meta.widgetOrder = o; M.Storage.touch('meta'); App.dashboard(root);
        });
      });
    },

    widget(id, g) {
      const p = M.Goals.progress(g, M.Timer.isActive && M.Timer.active.goalId === g.id ? M.Timer.elapsed() : 0);
      const tb = M.Goals.isTimeBased(g);
      const st = M.Analytics.stats();
      switch (id) {
        case 'progress': {
          const verbs = tb ? 'completed' : 'done';
          return `<div class="hero">
            <div class="hero-copy">
              <p class="eyebrow accent-text">Your journey</p>
              <h1 class="hero-title">${U.esc(g.name)}</h1>
              <p class="hero-sub">I am not sowing hours. I am sowing seeds.</p>
              <div class="hero-total"><span class="tnum">${tb ? U.hms(p.targetMs) : g.target + ' ' + U.esc(M.Goals.unitLabel(g))}</span><span class="label">Total goal</span></div>
              <div class="hero-pair">
                <div><span class="tnum" data-hero-done>${tb ? U.hms(p.doneMs) : U.esc(M.Goals.fmtValue(p))}</span><span class="label">${verbs}</span></div>
                <div><span class="tnum" data-hero-rem>${tb ? U.hms(p.remainingMs) : U.esc(M.Goals.fmtRemaining(p))}</span><span class="label">remaining</span></div>
              </div>
              <div class="bar lg" role="progressbar" aria-label="Journey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(p.pct * 100)}"><span data-hero-bar style="width:${p.pct * 100}%"></span></div>
              <div class="row gap wrap">
                ${M.Timer.isActive ? `<button class="btn primary lg" data-open-focus>${U.icon('pray')} Return to prayer</button>` : `<button class="btn primary lg" data-start-quick="pray">${U.icon('play')} Start prayer</button>`}
                <button class="btn ghost lg" data-go="seed">View journey</button>
              </div>
            </div>
            <div class="hero-ring" data-hero-ring>
              ${M.Analytics.ring(p.pct, 240, 9, Math.floor(p.pct * 100) + '% of ' + g.name)}
              <div class="ring-center"><span class="ring-pct tnum" data-hero-pct>${Math.floor(p.pct * 100)}%</span><span class="label">complete</span></div>
            </div>
          </div>
          <div class="stat-strip hero-stats">
            <div class="stat"><p class="stat-k">${tb ? 'Hours sown' : 'Sown'}</p><p class="stat-v tnum">${U.esc(M.Goals.fmtValue(p))}</p></div>
            <div class="stat"><p class="stat-k">${tb ? 'Hours remaining' : 'Remaining'}</p><p class="stat-v tnum">${U.esc(M.Goals.fmtRemaining(p))}</p></div>
            <div class="stat"><p class="stat-k">Sessions</p><p class="stat-v tnum">${p.sessions}</p></div>
            <div class="stat"><p class="stat-k">Current streak</p><p class="stat-v tnum">${st.currentStreak} ${st.currentStreak === 1 ? 'day' : 'days'}</p></div>
          </div>
          <p class="motto">Money doesn’t deserve my time. <span class="accent-text">God’s will does.</span></p>`;
        }
        case 'timer':
          if (M.Timer.isActive) return `<p class="w-k">Prayer session</p><p class="w-big tnum" data-live-time>${U.hms(M.Timer.elapsed())}</p><p class="muted">${M.Timer.isPaused ? 'Paused' : 'You are sowing.'}</p><button class="btn primary" data-open-focus>Return to the prayer room</button>`;
          return `<p class="w-k">Prayer</p><p class="w-lede">Plant today’s seed.</p>
            <div class="quick-modes">${['pray', 'scripture', 'declare', 'listen'].map((m) => `<button class="chip" data-start-quick="${m}">${U.icon(M.Prayer.mode(m).icon)} ${M.Prayer.modeLabel(m)}</button>`).join('')}</div>
            <button class="btn primary" data-start-quick="pray">${U.icon('play')} Start prayer</button>`;
        case 'today': {
          const tgt = M.Goals.dailyTargetMs(g); const tMs = M.Analytics.todayMs(M.Timer.isActive ? M.Timer.elapsed() : 0);
          return `<p class="w-k">Today’s target</p>
            <div class="today-mini"><div class="ring-sm">${M.Analytics.ring(tMs / tgt, 104, 7, 'Today ' + Math.round(tMs / tgt * 100) + '%')}<span class="tnum">${Math.min(100, Math.round(tMs / tgt * 100))}%</span></div>
            <dl class="kv"><div><dt>Target</dt><dd class="tnum">${U.hm(tgt)}</dd></div><div><dt>Completed</dt><dd class="tnum" data-today-done>${U.hm(tMs)}</dd></div><div><dt>Remaining</dt><dd class="tnum" data-today-rem>${tMs >= tgt ? 'Target reached' : U.hm(tgt - tMs)}</dd></div></dl></div>
            <button class="btn sm ghost" data-go="today">Open today</button>`;
        }
        case 'tree': {
          const s = M.Viz.stage(p.pct);
          return `<p class="w-k">Your faith journey</p><canvas class="tree-canvas" role="img" aria-label="Seed tree at stage ${s.name}"></canvas>
            <div class="row between center"><p><strong>${s.name}</strong> <span class="muted small">· stage ${s.index + 1} of 7</span></p><button class="btn sm ghost" data-go="seed">Open</button></div>`;
        }
        case 'streak': {
          const days = Array.from({ length: 14 }, (_, i) => U.addDays(U.startOfDay(Date.now()), i - 13));
          const totals = M.Analytics.dayTotals(M.Storage.getSessions());
          return `<p class="w-k">Current streak</p><p class="w-big tnum">${st.currentStreak} <small>${st.currentStreak === 1 ? 'day' : 'days'}</small></p>
            <div class="streak-dots" aria-label="Last 14 days">${days.map((d) => `<span class="${totals.get(U.dayKey(d)) ? 'on' : ''}" title="${U.fmtDate(d)}"></span>`).join('')}</div>
            <p class="muted small">Best: ${st.bestStreak} ${st.bestStreak === 1 ? 'day' : 'days'} · ${U.esc(M.Declarations.encouragement())}</p>`;
        }
        case 'scripture': return M.Scripture.card(M.Scripture.today(), { compact: true });
        case 'declaration': {
          const d = M.Declarations.today();
          return `<p class="kind">Today’s declaration · ${M.Declarations.number(d)}</p>
            <button class="reveal" data-reveal aria-expanded="false"><span class="declaration-line">“${U.esc(d.text)}”</span><span class="tap-hint">Tap to reveal</span></button>
            <button class="btn sm ghost" data-go="declarations">Declare</button>`;
        }
        case 'flow':
          return `<div class="row between center wrap gap"><div><p class="kind"><span class="pill vis">Faith visualization</span></p><h2 class="h3">The Flow</h2><p class="muted small">Visualize your mission reaching nations and creating value around the world.</p></div>
            <div class="row gap-s wrap"><button class="btn sm ghost" data-globe>${U.icon('globe')} Global flow</button><button class="btn sm ghost" data-vision>${U.icon('eye')} Vision mode</button></div></div>
            <canvas class="map-canvas" aria-label="Faith visualization: streams of light flowing from the nations toward your mission"></canvas>`;
        case 'recent':
          return `<div class="row between center"><p class="w-k">Recent sessions</p><button class="btn sm ghost" data-go="pray">All</button></div>${M.Prayer.timeline(M.Storage.getSessions().slice().reverse(), { limit: 5, compact: true })}`;
        case 'achievements': {
          const u = M.state.achievements.unlocked;
          const earned = M.Achievements.DEFS.filter((d) => u[d.id]).sort((a, b) => u[b.id] - u[a.id]);
          const next = M.Achievements.DEFS.find((d) => !u[d.id]);
          return `<div class="row between center"><p class="w-k">Achievements</p><button class="btn sm ghost" data-go="achievements">All</button></div>
            ${earned.length ? `<div class="badge-row">${earned.slice(0, 4).map((d) => `<span class="badge-ico" title="${U.esc(d.name)}">${U.icon(d.icon)}</span>`).join('')}</div><p class="small"><strong>${earned.length}</strong> of ${M.Achievements.DEFS.length} earned</p>` : '<p class="muted">The journey has just begun.</p>'}
            ${next ? `<p class="muted small">Next: <strong>${U.esc(next.name)}</strong> — ${U.esc(next.desc)}</p>` : ''}`;
        }
        case 'journal': {
          const j = M.Storage.getJournal()[0];
          return `<div class="row between center"><p class="w-k">Journal</p><button class="btn sm ghost" data-go="journal">Open</button></div>
            ${j ? `<p class="kind">${U.esc(j.category.charAt(0) + j.category.slice(1).toLowerCase())} · ${U.fmtDate(j.createdAt, { month: 'short', day: 'numeric' })}</p><p class="clamp3">${U.esc(j.text)}</p>` : '<p class="muted">Write what you are learning.</p>'}`;
        }
        case 'estimate': return M.Analytics.projectionHTML(M.Analytics.projection(g), g);
        case 'vision': return M.Vision.widget();
      }
      return '';
    },

    /* ---------------- today ---------------- */
    today(root) {
      const g = M.Goals.active();
      const tgt = M.Goals.dailyTargetMs(g);
      const tMs = M.Analytics.todayMs(M.Timer.isActive ? M.Timer.elapsed() : 0);
      const pct = tMs / tgt;
      root.innerHTML = `
        <header class="view-head"><p class="eyebrow">Today · ${U.esc(U.fmtLongDate(Date.now()))}</p><h1 class="view-title">${U.esc(U.greeting().replace('.', ''))}. Give God your attention.</h1></header>
        <section class="panel today-hero">
          <div class="ring-wrap">${M.Analytics.ring(pct, 200, 10, 'Today ' + Math.round(pct * 100) + '%')}<div class="ring-center"><span class="ring-pct tnum">${Math.min(100, Math.round(pct * 100))}%</span><span class="label">of today</span></div></div>
          <dl class="kv big">
            <div><dt>Today’s target</dt><dd class="tnum">${U.hm(tgt).toUpperCase()}</dd></div>
            <div><dt>Completed today</dt><dd class="tnum" data-today-done>${U.hm(tMs)}</dd></div>
            <div><dt>Remaining today</dt><dd class="tnum" data-today-rem>${tMs >= tgt ? 'Target reached' : U.hm(tgt - tMs)}</dd></div>
          </dl>
          <div class="row gap wrap">${M.Timer.isActive ? '<button class="btn primary" data-open-focus>Return to prayer</button>' : `<button class="btn primary" data-start-quick>${U.icon('play')} Start prayer</button>`}<button class="btn ghost" data-go="settings">Change target</button></div>
        </section>
        <section class="panel"><h2 class="h3">Today’s sessions</h2>${M.Prayer.timeline(M.Analytics.todaySessions().slice().reverse())}</section>
        <section class="panel"><h2 class="h3">Your rhythm</h2>${M.Analytics.heatmap()}</section>
        <p class="motto center">${U.esc(M.Declarations.encouragement())}</p>`;
      U.$$('[data-start-quick]', root).forEach((b) => b.onclick = () => M.Prayer.start({ mode: 'pray' }));
      U.$$('[data-open-focus]', root).forEach((b) => b.onclick = () => M.Prayer.openFocus());
      U.$$('[data-go]', root).forEach((b) => b.onclick = () => App.go(b.dataset.go));
    },

    /* ---------------- seed journey ---------------- */
    seed(root) {
      const g = M.Goals.active();
      const p = M.Goals.progress(g, M.Timer.isActive ? M.Timer.elapsed() : 0);
      const s = M.Viz.stage(p.pct);
      const tb = M.Goals.isTimeBased(g);
      const scale = (h) => tb ? Math.round(h / 58 * g.target * 10) / 10 : null;
      const ms = M.Achievements.thresholds(g).concat(tb ? [+g.target] : []);
      root.innerHTML = `
        <header class="view-head"><p class="eyebrow">Your faith journey</p><h1 class="view-title">Every completed minute is a seed.</h1>
        <p class="lede">58 hours → seeds → roots → growth → fruit → vision. The tree is a picture of faithfulness, not a prediction of returns.</p></header>
        <section class="seed-stage panel">
          <canvas class="seed-canvas" role="img" aria-label="Seed tree, stage ${s.name}"></canvas>
          <div class="seed-meta">
            <p class="kind">Stage ${s.index + 1} of 7</p>
            <p class="seed-name">${s.name}</p>
            <p class="muted">${s.note}</p>
            <p class="seed-num tnum">${U.esc(M.Goals.fmtValue(p))} <span class="muted">sown of ${g.target} ${U.esc(M.Goals.unitLabel(g))}</span></p>
          </div>
        </section>
        <section class="panel">
          <h2 class="h3">Stages</h2>
          <ol class="stage-list">${M.Viz.STAGES.map((st, i) => `<li class="${i < s.index ? 'past' : i === s.index ? 'now' : ''}"><span class="st-dot" aria-hidden="true"></span><span class="st-name">${st.name}</span><span class="muted small tnum">${tb ? 'from ' + scale(st.from) + 'h' : 'from ' + Math.round(st.from / 58 * 100) + '%'}</span><span class="muted small st-note">${st.note}</span>${i === s.index ? '<span class="pill accent">Now</span>' : ''}</li>`).join('')}</ol>
        </section>
        ${ms.length ? `<section class="panel"><h2 class="h3">Milestones</h2><div class="milestones">${ms.map((h) => `<span class="ms ${p.doneMs >= h * 3600000 ? 'on' : ''}"><span class="tnum">${h}h</span>${p.doneMs >= h * 3600000 ? U.icon('check') : ''}</span>`).join('')}</div></section>` : ''}`;
      M.Viz.mountTree(U.$('.seed-canvas', root), () => M.Goals.progress(g, M.Timer.isActive ? M.Timer.elapsed() : 0).pct);
    },

    /* ---------------- the flow ---------------- */
    flow(root) {
      const g = M.Goals.active();
      const p = M.Goals.progress(g);
      const IMAGINE = [
        'Imagine waking up without your first thought being: How will I make money today?', 'Imagine having uninterrupted time with God.',
        'Imagine being able to spend the morning praying, reading, thinking and creating.', 'Imagine building systems that continue producing value while you sleep.',
        'Imagine having enough margin to serve people.', 'Imagine having time for family.', 'Imagine traveling without feeling like you are escaping your responsibilities.',
        'Imagine teaching thousands of people.', 'Imagine creating products that continue serving people.', 'Imagine giving generously.',
        'Imagine building organizations that outlive you.', 'Imagine having the freedom to say YES to the things God calls you to do.',
        'Imagine no longer measuring your life only by how much money you made.'
      ];
      root.innerHTML = `
        <header class="view-head flow-head">
          <p class="kind"><span class="pill vis">The nations</span></p>
          <h1 class="view-title">The Flow</h1>
          <p class="lede">Provision, opportunity and impact flowing from the nations to your mission — growing with every hour you spend with God.</p>
          <div class="row gap wrap"><button class="btn primary" data-globe>${U.icon('globe')} Enter global flow</button><button class="btn ghost" data-vision>${U.icon('eye')} Enter vision mode</button></div>
        </header>
        ${M.Vision.panel()}
        <section class="panel dark-panel">
          <div class="row between center wrap gap"><p class="kind light">The nations → your mission</p><p class="small light-muted">Brightness grows with your journey: ${Math.floor(p.pct * 100)}%</p></div>
          <canvas class="map-canvas big" aria-label="World map: glowing streams from Africa, Europe, the Americas, Asia, the Middle East and Oceania flowing toward your mission"></canvas>
          <div class="region-row">${M.Viz.REGIONS.map((r) => `<span>${r}</span>`).join('')}</div>
          <p class="scripture-inline">“The wealth of the nations will flow to you like a river that never goes dry.” <span class="muted">Isaiah 66:12 GNT · Scripture</span></p>
        </section>
        <section class="panel dark-panel">
          <p class="kind light">Provision &amp; opportunity — faith visualization</p>
          <canvas class="river-canvas" aria-label="A luminous river entering from the horizon and branching into business, clients, ideas, partnerships, products, systems, investments, opportunities, impact and generosity"></canvas>
          <p class="small light-muted center">The river grows brighter as your seed count increases. Remain attentive to God’s direction, opportunities, wisdom and provision.</p>
        </section>
        <section class="imagine">
          <p class="eyebrow">Imagine your life</p>
          <ol class="imagine-list">${IMAGINE.map((t) => `<li>${U.esc(t)}</li>`).join('')}</ol>
          <p class="imagine-final">Money is a servant.<br>Purpose is the master.</p>
        </section>
        <section class="panel real-panel">${M.Journal.provisionHTML()}</section>`;
      M.Viz.mountFlowMap(U.$('.map-canvas', root), () => 0.25 + 0.75 * p.pct);
      M.Viz.mountRiver(U.$('.river-canvas', root), () => 0.2 + 0.8 * p.pct);
      U.$$('[data-globe]', root).forEach((b) => b.onclick = () => M.Viz.openGlobalFlow());
      U.$$('[data-vision]', root).forEach((b) => b.onclick = () => M.Viz.openVision());
      M.Journal.bindProvision(root);
      M.Vision.countUp(root);
    },

    /* ---------------- daily opening experience ---------------- */
    maybeOpening() {
      const s = M.state.settings; const k = U.dayKey(Date.now());
      if (!s.openingExperience || M.state.meta.lastOpenDay === k) return;
      M.state.meta.lastOpenDay = k; M.Storage.touch('meta');
      if (U.$('#lock')) { const iv = setInterval(() => { if (!U.$('#lock')) { clearInterval(iv); App.opening(); } }, 400); return; }
      App.opening();
    },
    opening() {
      const g = M.Goals.active();
      const v = M.Scripture.today(); const d = M.Declarations.today();
      const el = document.createElement('div');
      el.className = 'cinema opening'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Good morning');
      el.innerHTML = `<div class="opening-inner">
        <p class="op-greet" data-o="1">${U.greeting().toUpperCase()}</p>
        <p class="kind light" data-o="2">Today’s seed</p>
        <p class="op-line" data-o="2">Your goal is not to chase money today.</p>
        <p class="op-line strong" data-o="3">Your goal is to seek God.</p>
        <div class="op-grid" data-o="4">
          <div><p class="kind light">Today’s target</p><p class="op-target tnum">${U.hm(M.Goals.dailyTargetMs(g)).toUpperCase()}</p></div>
          <div><p class="kind light">Today’s Scripture</p><p class="op-verse">${U.esc(v.text)}</p><p class="scripture-ref">${U.esc(v.ref)} ${U.esc(v.v || '')}</p></div>
          <div><p class="kind light">Today’s declaration</p><p class="op-decl">“${U.esc(d.text)}”</p></div>
        </div>
        <div class="row gap wrap center-x" data-o="5"><button class="btn primary lg" data-begin>Begin</button><button class="btn ghost light" data-later>Later</button></div>
      </div><button class="btn ghost light cinema-skip" data-later>Skip</button>`;
      document.body.appendChild(el); document.body.classList.add('cinema-open');
      requestAnimationFrame(() => el.classList.add('in'));
      const rm = U.reducedMotion();
      const times = rm ? [0, 0, 0, 0, 0] : [300, 1800, 3800, 5200, 6000];
      const ids = times.map((t, i) => setTimeout(() => U.$$('[data-o="' + (i + 1) + '"]', el).forEach((n) => n.classList.add('on')), t));
      const close = () => { ids.forEach(clearTimeout); el.classList.remove('in'); document.body.classList.remove('cinema-open'); setTimeout(() => el.remove(), 500); };
      U.$('[data-begin]', el).onclick = () => { close(); App.go('pray'); };
      U.$$('[data-later]', el).forEach((b) => b.onclick = close);
      el.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      el.tabIndex = -1; el.focus();
    }
  };

  M.App = App;

  // Never let an unexpected UI error take the app down silently.
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.boot);
  else App.boot();
})(window.MDT = window.MDT || {});

</script>
</body>
</html>
