<style>
/* ==========================================================================

   Color: neutrals tinted by the theme hue (--h); one accent per theme,

/* ---------- theme hues & accents ---------- */
:root { --h: 222; --s: 38%; --acc-d: #d4ae62; --acc-l: #8f6a1f; }
:root[data-accent="midnight"] { --h: 225; --s: 12%; --acc-d: #5b95ff; --acc-l: #1f55d1; }
:root[data-accent="royal"]    { --h: 228; --s: 52%; --acc-d: #7b91ff; --acc-l: #3149c9; }
:root[data-accent="fire"]     { --h: 355; --s: 30%; --acc-d: #ee5b60; --acc-l: #b8232b; }
:root[data-accent="gold"]     { --h: 222; --s: 38%; --acc-d: #d4ae62; --acc-l: #8f6a1f; }
:root[data-accent="forest"]   { --h: 155; --s: 38%; --acc-d: #45d196; --acc-l: #0f7a52; }
:root[data-accent="heaven"]   { --h: 214; --s: 45%; --acc-d: #6ea3ff; --acc-l: #2360d8; }

:root[data-accent="ocean"]    { --h: 202; --s: 55%; --acc-d: #3fd0ee; --acc-l: #0a7894; }

/* ---------- light palette (base) ---------- */
:root {
  color-scheme: light;
  --bg: hsl(var(--h) 30% 97%);
  --bg-2: hsl(var(--h) 26% 94%);
  --surface: hsl(var(--h) 40% 99.5%);
  --surface-2: hsl(var(--h) 24% 95.5%);
  --line: hsl(var(--h) 18% 86%);
  --line-2: hsl(var(--h) 16% 78%);
  --text: hsl(var(--h) 30% 11%);
  --text-2: hsl(var(--h) 14% 30%);
  --muted: hsl(var(--h) 10% 42%);
  --accent: var(--acc-l);
  --accent-ink: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --leaf: #3f7a52; --bark: #6b5a45;
  --ok: #1f7a4d; --warn: #9a6200; --danger: #b3261e;
  --real: #1f6f5c;
  --glow: color-mix(in srgb, var(--accent) 16%, transparent);
  --shadow: 0 1px 2px hsl(var(--h) 30% 20% / .06), 0 8px 28px -12px hsl(var(--h) 30% 20% / .18);
  --radius: 16px; --radius-sm: 10px;

/* ---------- dark palette ---------- */

    --line: hsl(var(--h) calc(var(--s) * .5) 16%); --line-2: hsl(var(--h) calc(var(--s) * .5) 24%);
    --text: hsl(40 30% 91%); --text-2: hsl(var(--h) 14% 78%); --muted: hsl(var(--h) 10% 60%);
    --accent: var(--acc-d); --accent-ink: hsl(var(--h) 40% 7%);
    --leaf: #86b08f; --bark: #bca98d; --ok: #58c28c; --warn: #e2a53a; --danger: #ff6b61; --real: #5cc9a7;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"] {
  color-scheme: dark;
  --bg: hsl(var(--h) var(--s) 5.5%); --bg-2: hsl(var(--h) var(--s) 7.5%);
  --surface: hsl(var(--h) calc(var(--s) * .8) 8.5%); --surface-2: hsl(var(--h) calc(var(--s) * .7) 11.5%);
  --line: hsl(var(--h) calc(var(--s) * .5) 16%); --line-2: hsl(var(--h) calc(var(--s) * .5) 24%);
  --text: hsl(40 30% 91%); --text-2: hsl(var(--h) 14% 78%); --muted: hsl(var(--h) 10% 60%);
  --accent: var(--acc-d); --accent-ink: hsl(var(--h) 40% 7%);
  --leaf: #86b08f; --bark: #bca98d; --ok: #58c28c; --warn: #e2a53a; --danger: #ff6b61; --real: #5cc9a7;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7);

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }

@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.boot { padding: 20vh 0; text-align: center; } .boot-line { font: italic 400 34px var(--serif); margin-top: 10px; }

.sidebar { display: none; }

/* ---------- buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--text);

}

.btn:disabled { opacity: .45; pointer-events: none; }
.btn .ic { width: 18px; height: 18px; }

.danger-text { color: var(--danger); }
.btn.sm { min-height: 34px; padding: 0 13px; font-size: 13px; }
.btn.lg { min-height: 50px; padding: 0 24px; font-size: 15px; }

.btn.light, .btn.ghost.light { color: #f2ede3; border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.04); }
.btn.light-outline { color: #f2ede3; border-color: rgba(255,255,255,.25); background: transparent; }
.btn.round { width: 72px; height: 72px; padding: 0; border-radius: 50%; }
.btn.round .ic { width: 28px; height: 28px; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; transition: background .2s, color .2s; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.sm { width: 32px; height: 32px; } .icon-btn.sm .ic { width: 16px; height: 16px; }
.icon-btn.lg { width: 50px; height: 50px; border-color: var(--line); }
.icon-btn.on { color: var(--accent); }
.icon-btn.on .ic { fill: color-mix(in srgb, var(--accent) 30%, transparent); }
.icon-btn.light { color: rgba(242,237,227,.85); }
.icon-btn.light:hover { background: rgba(255,255,255,.08); color: #fff; }
.icon-btn.light.on { color: var(--acc-d); }
.icon-btn:disabled { opacity: .35; pointer-events: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.chip-row.scroll-x::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font: 600 13px/1 var(--sans); cursor: pointer; white-space: nowrap; transition: all .2s; }
.chip .ic { width: 15px; height: 15px; }
.chip:hover { border-color: var(--line-2); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--text); }
.chip.on .ic { color: var(--accent); }
.chip.sm { min-height: 30px; padding: 0 11px; font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font: 700 10px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line-2); color: var(--text-2); }
.pill .ic { width: 12px; height: 12px; }
.pill.accent { border-color: var(--accent); color: var(--accent); }
.pill.vis { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); background: var(--accent-soft); }
.pill.real { border-color: var(--real); color: var(--real); background: color-mix(in srgb, var(--real) 10%, transparent); }
.tag { display: inline-block; font: 600 11px/1 var(--sans); padding: 5px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); margin: 0 4px 4px 0; }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); font-weight: 600; min-width: 0; }
.field.inline { flex-direction: row; align-items: center; gap: 10px; }
input:not([type="checkbox"]):not([type="range"]):not([type="color"]):not([type="file"]), select, textarea {
  width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 400; transition: border-color .2s, box-shadow .2s;
}
textarea { resize: vertical; line-height: 1.55; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:disabled { opacity: .7; }
input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 2px; cursor: pointer; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.form { display: flex; flex-direction: column; gap: 14px; }
.custom-min { display: inline-flex; gap: 6px; align-items: center; }
.custom-min input { width: 100px !important; min-height: 36px !important; padding: 6px 10px !important; }
.time-chip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 2px 2px 6px; background: var(--surface); }
.time-chip input { border: 0 !important; min-height: 34px !important; padding: 4px !important; width: auto !important; background: transparent !important; box-shadow: none !important; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px 0; font-weight: 500; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 42px; height: 24px; border-radius: 999px; background: var(--line-2); position: relative; flex: none; transition: background .25s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 3px; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-2); }

.search input { border: 0 !important; box-shadow: none !important; background: transparent !important; padding-left: 0 !important; }
.search .ic { color: var(--muted); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.panel.soft { background: transparent; border-style: dashed; }
.view-head { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.view-head .row { margin-top: 10px; }
.section-head { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.section-head.row { flex-direction: row; }
.empty { text-align: center; padding: 36px 16px; border: 1px dashed var(--line-2); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty.small { padding: 18px; }
.empty-ico { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; }
.empty-title { font: 500 24px/1.2 var(--serif); }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, transparent), var(--accent)); border-radius: inherit; transition: width 1s var(--ease); }
.bar.lg { height: 8px; }
.hscroll, .table-wrap { overflow-x: auto; }

/* ---------- stats ---------- */
.stat-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
@media (min-width: 720px) { .stat-strip { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); } }
.stat { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.stat-v { font: 600 24px/1.1 var(--sans); letter-spacing: -.01em; }
.stat-v small { font-size: 13px; color: var(--muted); font-weight: 500; }

/* ---------- dashboard ---------- */
.dash-top { margin-bottom: -6px; }
.widgets { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 760px) { .widgets { grid-template-columns: 1fr 1fr; } .widget.full { grid-column: 1 / -1; } }
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: relative; transition: transform .25s var(--ease), border-color .2s, opacity .2s; }
.widget .btn { align-self: flex-start; }
.widget.w-scripture, .widget.w-declaration { background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
.widgets.arranging .widget { border-style: dashed; cursor: grab; }
.widget.is-hidden { opacity: .45; }
.widget.dragging { opacity: .4; } .widget.drop { border-color: var(--accent); }
.w-arrange { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.w-name { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px; }
.w-big { font: 300 44px/1 var(--sans); letter-spacing: -.02em; }
.w-big small { font-size: 16px; font-weight: 500; color: var(--muted); }
.w-lede { font: italic 400 26px/1.2 var(--serif); }
.quick-modes { display: flex; flex-wrap: wrap; gap: 8px; }

.widget.w-progress { padding: 0; overflow: hidden; gap: 0; background: var(--surface); }
.hero {
  display: grid; grid-template-columns: 1fr; gap: 24px; padding: 28px 22px; position: relative;
  background: radial-gradient(120% 90% at 85% 10%, var(--glow), transparent 55%), radial-gradient(80% 60% at 0% 100%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%);
}
@media (min-width: 760px) { .hero { grid-template-columns: 1.35fr 1fr; padding: 40px 40px 34px; align-items: center; } }
.hero-copy { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero-title { font: 500 clamp(38px, 6.4vw, 64px)/1 var(--serif); letter-spacing: -.015em; text-transform: uppercase; text-wrap: balance; }
.hero-sub { font: italic 400 21px/1.35 var(--serif); color: var(--text-2); }
.hero-total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.hero-total .tnum { font: 200 clamp(40px, 7vw, 60px)/1 var(--sans); letter-spacing: -.02em; }
.hero-pair { display: flex; gap: 28px; flex-wrap: wrap; }
.hero-pair > div, .hero-total { display: flex; flex-direction: column; gap: 4px; }
.hero-total { flex-direction: row; }
.hero-pair .tnum { font: 500 22px/1 var(--sans); }
.hero-pair .label, .hero-total .label { margin: 0; }
.hero-ring { position: relative; justify-self: center; width: min(240px, 70vw); aspect-ratio: 1; }
.hero-ring svg { width: 100%; height: 100%; }
.ring-track { fill: none; stroke: var(--surface-2); }
.ring-fill { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.4s var(--ease); }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.ring-pct { font: 200 56px/1 var(--sans); letter-spacing: -.03em; }
.ring-center .label { margin: 0; }
.hero-stats { border-radius: 0; border-width: 1px 0; }
.motto { padding: 18px 22px; font: italic 400 20px/1.4 var(--serif); color: var(--text-2); }
.today-mini { display: flex; align-items: center; gap: 20px; }
.ring-sm { position: relative; width: 104px; height: 104px; flex: none; }
.ring-sm > span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; }
.kv { display: grid; gap: 8px; margin: 0; }
.kv div { display: flex; justify-content: space-between; gap: 16px; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; font-weight: 600; }
.kv.big { gap: 14px; } .kv.big dd { font: 500 26px/1 var(--sans); }
.kv.big div { flex-direction: column; gap: 6px; }
.tree-canvas { width: 100%; height: 220px; display: block; }
.streak-dots { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; }
.streak-dots span { aspect-ratio: 1; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.streak-dots span.on { background: var(--accent); border-color: var(--accent); }
.reveal { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
.reveal .declaration-line { filter: blur(7px); opacity: .5; transition: filter .8s var(--ease), opacity .8s; }
.reveal.revealed .declaration-line { filter: none; opacity: 1; }
.reveal.revealed .tap-hint { display: none; }
.reveal:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.tap-hint { font: 700 10px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.badge-row { display: flex; gap: 10px; }
.map-canvas { width: 100%; aspect-ratio: 2.31; display: block; }

/* ---------- scripture & declarations ---------- */
.verse-card, .principle-card, .decl-card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.verse-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .verse-grid { grid-template-columns: 1fr 1fr; } }
.verse-grid .verse-card, .principle-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.today-verse .verse-card { padding: 30px 26px; border-radius: var(--radius); background: radial-gradient(100% 120% at 100% 0%, var(--glow), transparent 60%), var(--surface); border: 1px solid var(--line); }
.today-verse .verse { font-size: clamp(24px, 3.4vw, 32px); }
.verse { margin: 0; font-size: 21px; line-height: 1.45; font-weight: 500; color: var(--text); text-wrap: pretty; }
.verse.xl { font-size: clamp(24px, 3.6vw, 34px); line-height: 1.35; }
.verse-card.compact .verse { font-size: 20px; }
.scripture-ref { font: 700 12px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.scripture-ref .muted { color: var(--muted); letter-spacing: .06em; text-transform: none; font-weight: 500; }
.principle-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .principle-grid { grid-template-columns: 1fr 1fr; } }
.principle-card { border-left: 0; background: var(--bg-2); }
.principle { font: 500 21px/1.4 var(--serif); }
.declaration-line { font: 500 22px/1.4 var(--serif); }
.declaration-line.big { font-size: clamp(26px, 4vw, 38px); line-height: 1.3; text-wrap: balance; }
.deck-wrap { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.deck { width: 100%; max-width: 720px; min-height: 280px; border-radius: 22px; cursor: pointer; background: radial-gradient(90% 90% at 50% 0%, var(--glow), transparent 70%), var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 34px 26px; text-align: center; touch-action: pan-y; }
.decl-face { display: flex; flex-direction: column; gap: 18px; align-items: center; }
.decl-face .declaration-line { filter: blur(9px); opacity: .35; transition: filter 1s var(--ease), opacity 1s; }
.decl-face.revealed .declaration-line { filter: none; opacity: 1; }
.deck-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.decl-list { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; }
.decl-list li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.decl-list .num { font-weight: 700; color: var(--muted); font-size: 12px; width: 22px; }
.decl-list .t { flex: 1; font: 500 18px/1.35 var(--serif); }
.decl-list li.done .t { color: var(--text-2); }
.fav-dot { color: var(--accent); } .fav-dot .ic { width: 14px; height: 14px; fill: currentColor; }
.add-decl input { flex: 1; }
.philosophy { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
.philosophy li { font: 500 clamp(20px, 2.6vw, 26px)/1.3 var(--serif); text-transform: uppercase; letter-spacing: .02em; }
.philosophy li:nth-child(n+3) { color: var(--text-2); }

.meditation { display: flex; flex-direction: column; gap: 16px; }
.stepper { list-style: none; display: flex; gap: 6px; padding: 0; margin: 6px 0 0; flex-wrap: wrap; }
.step { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
.step.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step-body { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 14px; background: var(--surface-2); }
.step-guide { font: italic 400 19px/1.45 var(--serif); }

/* ---------- prayer view ---------- */
.start-panel { display: flex; flex-direction: column; gap: 18px; align-items: stretch; background: radial-gradient(90% 70% at 50% 0%, var(--glow), transparent 70%), var(--surface); }
.start-panel .label { margin: 0; }
.start-btn { align-self: center; margin-top: 4px; }
.start-panel > .btn.ghost { align-self: center; border: 0; color: var(--muted); }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.mode { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; text-align: left; transition: all .2s; color: var(--text-2); }
.mode .ic { color: var(--muted); }
.mode:hover { border-color: var(--line-2); }
.mode.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.mode.on .ic { color: var(--accent); }
.live-panel { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.live-time { font: 200 64px/1 var(--sans); letter-spacing: -.02em; }
.bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.bg-swatch { height: 72px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; display: flex; align-items: flex-end; padding: 8px 10px; color: #f2ede3; font: 700 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.bg-swatch.on { border-color: var(--accent); }
.bg-night { background: radial-gradient(circle at 30% 30%, #fff 0 1px, transparent 1.5px), radial-gradient(circle at 70% 20%, #fff 0 1px, transparent 1.5px), linear-gradient(#03050c, #0b1226); }
.bg-mountain { background: linear-gradient(170deg, transparent 55%, #0a0f1f 56%), linear-gradient(200deg, transparent 50%, #141b2e 51%), linear-gradient(#0a0f1f, #2a2a3a); }
.bg-room { background: linear-gradient(115deg, transparent 40%, rgba(255,220,170,.18) 50%, transparent 62%), linear-gradient(#0d0b0a, #1a1512); }
.bg-ocean { background: linear-gradient(#050b18 0 55%, #07101f 56%, #040812); }
.bg-garden { background: radial-gradient(circle at 30% 40%, rgba(245,235,170,.8) 0 1.5px, transparent 3px), radial-gradient(circle at 65% 60%, rgba(245,235,170,.8) 0 1.5px, transparent 3px), linear-gradient(#040b08, #0c1f16); }
.bg-sunrise { background: radial-gradient(circle at 50% 100%, rgba(255,210,150,.8) 0 10%, transparent 40%), linear-gradient(#0b0f24, #3a2a45 55%, #c98a52); }

/* timeline */
.timeline { display: flex; flex-direction: column; gap: 22px; }
.tl-day > ol { list-style: none; padding: 0; margin: 10px 0 0; border-left: 1px solid var(--line); }
.tl-date { font: 700 12px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.tl-item { display: flex; gap: 14px; align-items: flex-start; padding: 10px 0 10px 16px; position: relative; }
.tl-item::before { content: ""; position: absolute; left: -4px; top: 20px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tl-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); flex: none; }
.tl-ico .ic { width: 17px; height: 17px; }
.tl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tl-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tl-sub { color: var(--text-2); font-size: 14px; }
.tl-notes { font: italic 400 17px/1.45 var(--serif); color: var(--text-2); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl-tags { margin-top: 4px; }
.tl-actions { display: flex; gap: 2px; }
.timeline.compact { gap: 14px; }
.timeline.compact .tl-item { padding: 6px 0 6px 14px; }
.timeline.compact .tl-item::before { top: 16px; }

/* ---------- journal / testimonies / goals ---------- */
.entries { display: flex; flex-direction: column; gap: 12px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.entry .kind { margin: 0; }
.entry-title { font: 600 22px/1.25 var(--serif); }
.entry-text { font: 400 18px/1.55 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.testimony { border-left: 3px solid var(--real); }
.t-amount { font: 600 20px/1 var(--sans); color: var(--real); }
.goal-list { display: flex; flex-direction: column; gap: 12px; }
.goal-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; --goal: var(--accent); }
.goal-card.is-active { border-color: color-mix(in srgb, var(--goal) 55%, transparent); background: radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--goal) 10%, transparent), transparent 60%), var(--surface); }
.goal-card .bar span { background: var(--goal); }
.goal-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.goal-name { font: 500 26px/1.15 var(--serif); margin-top: 6px; }
.goal-num { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.goal-num strong { font: 300 34px/1 var(--sans); }
.goal-actions .btn { min-height: 32px; }

/* ---------- achievements ---------- */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.badge { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.badge-ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent) 30%, transparent), var(--accent-soft)); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); flex: none; }
.badge-ico.sm { width: 40px; height: 40px; }
.badge.locked .badge-ico { color: var(--muted); background: var(--surface-2); border-color: var(--line); }
.badge.locked { opacity: .75; }
.badge.earned .badge-ico { animation: badgeGlow 4s ease-in-out infinite; }
@keyframes badgeGlow { 50% { box-shadow: 0 0 22px -4px var(--accent); } }
.badge-name { font: 600 19px/1.2 var(--serif); }
.badge-state { color: var(--accent); font-weight: 600; }
.badge.locked .badge-state { color: var(--muted); }

/* ---------- analytics ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.c-bar { fill: color-mix(in srgb, var(--accent) 38%, var(--surface-2)); }
.c-bar.met, .c-bar.today { fill: var(--accent); }
.c-axis { stroke: var(--line-2); } .c-grid { stroke: var(--line); stroke-dasharray: 2 4; }
.c-target { stroke: var(--accent); stroke-dasharray: 4 5; opacity: .7; }
.c-label { fill: var(--muted); font: 600 11px var(--sans); }
.c-label.strong { fill: var(--text); }
.c-val { fill: var(--text-2); font: 600 11px var(--sans); }
.c-line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.c-area { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
.c-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.heatmap { display: block; width: 100%; }
.hm { fill: var(--surface-2); stroke: var(--line); stroke-width: .5; }
.hm.l1 { fill: color-mix(in srgb, var(--accent) 25%, var(--surface-2)); }
.hm.l2 { fill: color-mix(in srgb, var(--accent) 50%, var(--surface-2)); }
.hm.l3 { fill: color-mix(in srgb, var(--accent) 75%, var(--surface-2)); }
.hm.l4 { fill: var(--accent); }
.hm-legend { display: flex; align-items: center; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
.proj-date { font: 500 clamp(30px, 5vw, 44px)/1.1 var(--serif); letter-spacing: .02em; margin: 10px 0 14px; }
.proj-empty { font: italic 400 22px/1.4 var(--serif); margin-top: 10px; color: var(--text-2); }
.proj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 10px; }
.proj-grid .stat-v small { font-size: 12px; }
.today-hero { display: grid; gap: 24px; align-items: center; }
@media (min-width: 760px) { .today-hero { grid-template-columns: auto 1fr; } .today-hero > .row { grid-column: 1 / -1; } }
.ring-wrap { position: relative; width: 200px; height: 200px; justify-self: center; }

/* ---------- seed journey ---------- */
.seed-stage { display: grid; gap: 16px; background: radial-gradient(70% 80% at 50% 30%, var(--glow), transparent 70%), var(--surface); }
@media (min-width: 860px) { .seed-stage { grid-template-columns: 1.4fr 1fr; align-items: center; } }
.seed-canvas { width: 100%; height: min(60vh, 460px); display: block; }
.seed-meta { display: flex; flex-direction: column; gap: 8px; }
.seed-name { font: 500 clamp(40px, 6vw, 60px)/1 var(--serif); text-transform: uppercase; letter-spacing: .02em; }
.seed-num { font: 300 26px/1.2 var(--sans); margin-top: 8px; }
.seed-num .muted { font-size: 15px; }
.stage-list { list-style: none; padding: 0; margin: 0; }
.stage-list li { display: grid; grid-template-columns: 14px 130px auto 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.st-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.stage-list li.past .st-dot { background: var(--accent); border-color: var(--accent); }
.stage-list li.now .st-dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.st-name { font: 600 19px/1.2 var(--serif); }
.stage-list li:not(.past):not(.now) .st-name { color: var(--muted); }
@media (max-width: 640px) { .stage-list li { grid-template-columns: 14px 1fr auto; } .st-note { grid-column: 2 / -1; } }
.milestones { display: flex; flex-wrap: wrap; gap: 8px; }
.ms { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; color: var(--muted); }
.ms.on { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.ms .ic { width: 14px; height: 14px; color: var(--accent); }

/* ---------- the flow ---------- */
.dark-panel { background: radial-gradient(90% 70% at 50% 0%, color-mix(in srgb, var(--acc-d) 12%, transparent), transparent 70%), #060a14; border-color: #1a2236; color: #e9e4d8; --text: #e9e4d8; --muted: #8e97ad; --accent: var(--acc-d); --leaf: #86b08f; --bark: #bca98d; --bg: #060a14; }
.dark-panel .kind.light, .kind.light { color: rgba(233,228,216,.6); }
.light-muted { color: rgba(233,228,216,.6); }
.dark-panel .map-canvas.big { margin: 10px 0; }
.region-row { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; font: 700 10px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: rgba(233,228,216,.5); padding: 6px 0 12px; }
.scripture-inline { font: italic 400 19px/1.4 var(--serif); text-align: center; max-width: 60ch; margin: 0 auto; }
.scripture-inline .muted { font: 600 11px var(--sans); letter-spacing: .08em; font-style: normal; display: block; margin-top: 6px; }
.river-canvas { width: 100%; height: clamp(360px, 60vw, 520px); display: block; }
.imagine { padding: 20px 0; display: flex; flex-direction: column; gap: 18px; }
.imagine-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.imagine-list li { font: 400 clamp(21px, 2.6vw, 28px)/1.35 var(--serif); padding: 14px 0; border-bottom: 1px solid var(--line); text-wrap: balance; }
.imagine-list li:first-child { font-style: italic; }
.imagine-final { font: 500 clamp(34px, 6vw, 60px)/1.05 var(--serif); text-transform: uppercase; letter-spacing: .01em; padding-top: 20px; }
.real-panel { border: 1.5px solid color-mix(in srgb, var(--real) 50%, transparent); background: color-mix(in srgb, var(--real) 4%, var(--surface)); }
.real-log { display: flex; flex-direction: column; gap: 14px; }
.real-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.real-table th { text-align: left; font: 700 10px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); }
.real-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.real-table .num { text-align: right; font-weight: 700; color: var(--real); }

/* ---------- settings ---------- */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.theme-sw { display: grid; grid-template-columns: 36px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.theme-sw .sw { grid-row: 1 / 3; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); }
.theme-sw .tn { font-weight: 700; font-size: 14px; }
.theme-sw .ts { font-size: 11px; color: var(--muted); }
.theme-sw.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.panel > .switch + .switch { border-top: 1px solid var(--line); }

/* ---------- sync status ---------- */
.sync-status { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 12px/1 var(--sans); color: var(--text-2); }

/* ---------- live pill ---------- */
.live-pill { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: var(--text); color: var(--bg); cursor: pointer; box-shadow: var(--shadow); font-weight: 600; font-size: 14px; }

/* ---------- toasts ---------- */

.toast { background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); opacity: 0; transform: translateY(-8px); transition: opacity .35s var(--ease), transform .35s var(--ease); display: flex; gap: 12px; align-items: center; }
.toast.in { opacity: 1; transform: none; }
.toast.warn { background: var(--warn); color: #140d00; }
.toast .muted { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.badge-toast .badge-ico { color: var(--accent); }

/* ---------- modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 200; display: grid; place-items: end center; }
@media (min-width: 640px) { .modal-wrap { place-items: center; } }
.modal-scrim { position: absolute; inset: 0; background: rgba(4,6,12,.55); opacity: 0; transition: opacity .3s; backdrop-filter: blur(3px); }
.modal { position: relative; width: min(560px, 100%); max-height: min(88vh, 900px); overflow-y: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 26px 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; transform: translateY(30px); opacity: 0; transition: transform .4s var(--ease), opacity .3s; }
@media (min-width: 640px) { .modal { border-radius: 22px; padding: 30px; } }
.modal.wide { width: min(760px, 100%); }

.modal-wrap.in .modal { transform: none; opacity: 1; }
.modal-title { font: 500 28px/1.15 var(--serif); padding-right: 40px; }
.modal-x { position: absolute; top: 14px; right: 14px; }

/* ---------- cinema overlays (always dark) ---------- */
.cinema, .focus { position: fixed; inset: 0; z-index: 120; color: #f2ede3; background: #03050a; opacity: 0; transition: opacity .6s var(--ease); overflow: hidden; color-scheme: dark;
  --accent: var(--acc-d); --accent-ink: #0a0d16; --text: #f2ede3; --text-2: rgba(242,237,227,.8); --muted: rgba(242,237,227,.55); --bg: #03050a; --leaf: #86b08f; --bark: #bca98d; --line: rgba(255,255,255,.14); --line-2: rgba(255,255,255,.24); --surface: rgba(255,255,255,.04); --surface-2: rgba(255,255,255,.07); }
.cinema.in, .focus.in { opacity: 1; }

.cinema-badge { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font: 700 10px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: rgba(242,237,227,.65); border: 1px solid rgba(242,237,227,.2); padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
.cinema-bar { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px; }

.cinema-line.on { opacity: 1; transform: none; }
.vision-stage { position: absolute; inset: 0; display: grid; place-items: center; padding: 80px 20px 130px; }
.vision-scene { display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; max-width: 860px; opacity: 0; transform: scale(.98); transition: opacity 1.6s var(--ease), transform 2.4s var(--ease); }

.vision-icon .ic { width: clamp(90px, 16vw, 140px); height: auto; color: var(--acc-d); stroke-width: .7; filter: drop-shadow(0 0 20px color-mix(in srgb, var(--acc-d) 60%, transparent)); }

.vdot { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.25); cursor: pointer; }

.celebrate { display: grid; place-items: center; padding: 20px; background: rgba(3,5,10,.92); }

.celebrate-num { font: 500 clamp(52px, 12vw, 88px)/1 var(--serif); letter-spacing: .02em; color: var(--acc-d); animation: rise 1.2s var(--ease) both; }

.completion { display: grid; place-items: center; }
.completion-text { position: absolute; left: 16px; right: 16px; top: 58%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; overflow-y: auto; }

/* opening */
.opening { display: grid; place-items: center; background: radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--acc-d) 16%, transparent), transparent 70%), #04060c; overflow-y: auto; }

/* session end */
.end-flow { overflow-y: auto; background: radial-gradient(80% 50% at 50% 0%, color-mix(in srgb, var(--acc-d) 14%, transparent), transparent 70%), #04060c; }
.end-inner { width: min(760px, 100%); margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 28px; }
.end-stats { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }

.end-flow [data-s].on { opacity: 1; transform: none; }
.end-k { font: 700 11px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: rgba(242,237,227,.6); }
.end-big { font: 200 clamp(64px, 16vw, 120px)/1 var(--sans); letter-spacing: -.03em; color: var(--acc-d); }

.end-pair { display: flex; gap: 36px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.end-pair > div { display: flex; flex-direction: column; gap: 8px; }
.end-mid { font: 300 32px/1 var(--sans); }
.end-tree { width: 100%; height: 220px; }
.end-msg { font: 500 24px/1.3 var(--serif); }
.end-form { display: flex; flex-direction: column; gap: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 22px; --surface: rgba(255,255,255,.04); --surface-2: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); --line-2: rgba(255,255,255,.24); --text: #f2ede3; --text-2: rgba(242,237,227,.8); --muted: rgba(242,237,227,.55); --accent-soft: color-mix(in srgb, var(--acc-d) 18%, transparent); color-scheme: dark; }
.end-q { font: 500 26px/1.2 var(--serif); }
.seed-chip .ic { color: var(--acc-d); }
.end-actions { justify-content: center; }

/* ---------- prayer room / focus ---------- */
.focus { display: grid; grid-template-rows: auto 1fr auto auto; overflow-y: auto; }
.focus > *:not(canvas) { position: relative; }
.focus-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; flex-wrap: wrap; }
.focus-mode { display: inline-flex; gap: 8px; align-items: center; font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: rgba(242,237,227,.7); max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-mode .ic { width: 16px; height: 16px; color: var(--acc-d); }
.focus-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px 16px; text-align: center; }
.focus-prompt { min-height: 1.4em; font: italic 400 clamp(22px, 3.2vw, 30px)/1.3 var(--serif); color: rgba(242,237,227,.85); opacity: 0; transition: opacity 1.2s var(--ease); }

.end-btn { margin-top: 10px; color: rgba(242,237,227,.85); border-color: rgba(242,237,227,.2); background: rgba(255,255,255,.03); }
.end-btn:hover { border-color: var(--acc-d); }
.focus-words { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 0 16px 10px; max-width: 1100px; width: 100%; margin: 0 auto; }
@media (min-width: 860px) { .focus-words { grid-template-columns: 1.3fr 1fr 180px; align-items: end; } }
.focus-words figure { margin: 0; padding: 16px 18px; border-radius: 16px; background: rgba(8,10,18,.45); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

@media (max-width: 859px) { .focus-seed, .focus-decl { display: none; } .focus-verse blockquote { font-size: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } .focus-wake { display: none; } }
@media (max-height: 640px) { .focus-words { display: none; } }

/* ---------- lock ---------- */
.lock { position: fixed; inset: 0; z-index: 500; background: var(--bg); display: grid; place-items: center; padding: 20px; }
.lock-card { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(320px, 100%); text-align: center; }

/* ---------- motion preferences ---------- */

  :root:not([data-motion="full"]) *, :root:not([data-motion="full"]) *::before, :root:not([data-motion="full"]) *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }

/* ---------- text size (applies to the page, not overlays) ---------- */
.view, .sidebar { zoom: var(--fs); }

/* ---------- numbers font (timer, counters, big figures) ---------- */
.hero-total .tnum, .hero-pair .tnum, .ring-pct, .w-big, .live-time, .stat-v, .focus-time, .end-big, .end-mid, .op-target,
.seed-num, .goal-num strong, .kv.big dd, .va-amount, .focus-va-amt, .globe-va-amt, .lp-time, .ring-sm > span, .fp-num { font-family: var(--num); }

/* ---------- font settings ---------- */
.pair-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.pair { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--text); }

.font-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.font-preview { margin-top: 16px; padding: 18px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.fp-title { font: 500 28px/1.15 var(--serif); }

/* ---------- vision account ---------- */

@media (min-width: 900px) { .va-grid { grid-template-columns: 1.1fr 1fr; } }

.va-pop { display: inline-flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); font-size: 13px; color: var(--text-2); animation: vaPop 6s var(--ease) forwards; }

@keyframes vaPop { 0% { opacity: 0; transform: translateY(10px) scale(.96); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
.widget.w-vision { background: radial-gradient(80% 120% at 100% 0%, var(--glow), transparent 60%), var(--surface); }
.widget.w-vision .va-curr { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

/* in the prayer room & cinema overlays */
.focus-va { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 8px; }
.focus-va .kind { margin: 0; }

.globe-va { position: absolute; top: calc(56px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }

/* time adjusters */

  /* =========================================================================
     RIVER — "Provision & Opportunity" flowing water visual
     ========================================================================= */
  const BRANCHES = ['Business', 'Clients', 'Ideas', 'Partnerships', 'Products', 'Systems', 'Investments', 'Opportunities', 'Impact', 'Generosity'];
  V.mountRiver = (cv, getIntensity) => {
    const parts = [];
    for (let i = 0; i < 160; i++) parts.push({ u: Math.random(), o: Math.random() * 2 - 1, b: Math.floor(Math.random() * BRANCHES.length), s: 0.03 + Math.random() * 0.04 });
    let lastT = 0;
    return V.animate(cv, (ctx, W, H, t) => {
      const I = U.clamp(typeof getIntensity === 'function' ? getIntensity() : 0.5, 0, 1);
      const dt = Math.min(0.1, Math.max(0, t - lastT)); lastT = t;
      ctx.clearRect(0, 0, W, H);
      const top = H * 0.1, split = H * 0.52, bottom = H * 0.84;
      const midX = (y) => W / 2 + Math.sin(y / H * 5.5) * W * 0.035;
      const width = (y) => 2 + (y - top) / (split - top) * W * 0.07;
      // horizon glow
      const hg = ctx.createRadialGradient(W / 2, top, 0, W / 2, top, W * 0.45);
      hg.addColorStop(0, rgba(C.accent, 0.35 + 0.35 * I)); hg.addColorStop(1, rgba(C.accent, 0));
      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H * 0.6);
      ctx.strokeStyle = rgba(C.text, 0.12); ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(W, top); ctx.stroke();
      // river body
      ctx.beginPath();
      for (let y = top; y <= split; y += 4) ctx.lineTo(midX(y) - width(y), y);
      for (let y = split; y >= top; y -= 4) ctx.lineTo(midX(y) + width(y), y);
      const rb = ctx.createLinearGradient(0, top, 0, split);
      rb.addColorStop(0, rgba(C.accent, 0.5 * (0.4 + I))); rb.addColorStop(1, rgba(C.accent, 0.12 + 0.18 * I));
      ctx.fillStyle = rb; ctx.fill();
      // branches
      const sx = midX(split);
      const ends = BRANCHES.map((b, i) => ({ x: W * (0.06 + 0.88 * i / (BRANCHES.length - 1)), y: bottom }));
      const bez = (e, s) => {
        const cx1 = sx, cy1 = split + (bottom - split) * 0.55;
        return [(1 - s) * (1 - s) * sx + 2 * (1 - s) * s * cx1 + s * s * e.x, (1 - s) * (1 - s) * split + 2 * (1 - s) * s * cy1 + s * s * e.y];
      };
      ends.forEach((e) => {
        ctx.strokeStyle = rgba(C.accent, 0.12 + 0.3 * I); ctx.lineWidth = 1 + I * 2.2;
        ctx.beginPath(); ctx.moveTo(sx, split); ctx.quadraticCurveTo(sx, split + (bottom - split) * 0.55, e.x, e.y); ctx.stroke();
        ctx.fillStyle = rgba(C.accent, 0.5 + 0.5 * I); ctx.beginPath(); ctx.arc(e.x, e.y, 2.5, 0, TAU); ctx.fill();
      });
      // particles
      ctx.globalCompositeOperation = 'lighter';
      const n = Math.round(40 + I * 120);
      for (let i = 0; i < n; i++) {
        const p = parts[i];
        p.u += p.s * dt * (0.6 + I);
        if (p.u > 1) { p.u = 0; p.b = Math.floor(Math.random() * BRANCHES.length); p.o = Math.random() * 2 - 1; }
        let x, y;
        if (p.u < 0.55) { const s = p.u / 0.55; y = top + (split - top) * s; x = midX(y) + p.o * width(y) * 0.8; }
        else { const s = (p.u - 0.55) / 0.45; [x, y] = bez(ends[p.b], s); }
        const a = (0.3 + 0.7 * I) * Math.min(1, p.u * 8, (1 - p.u) * 6);
        ctx.fillStyle = rgba(C.accent, a * 0.2); ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
        ctx.fillStyle = rgba(C.text, a * 0.9); ctx.beginPath(); ctx.arc(x, y, 1.1, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      // labels
      const narrow = W < 640;
      ctx.font = '600 ' + (narrow ? 8.5 : 10.5) + 'px ' + uiFont();
      ctx.textAlign = 'center'; ctx.fillStyle = rgba(C.text, 0.8);
      ends.forEach((e, i) => ctx.fillText(BRANCHES[i].toUpperCase(), e.x, e.y + (narrow && i % 2 ? 30 : 18)));
    });

  /* =========================================================================
     GLOBE — immersive global flow (full screen)
     ========================================================================= */
  function vec(lon, lat) { const a = lon * Math.PI / 180, b = lat * Math.PI / 180; return [Math.cos(b) * Math.cos(a), Math.cos(b) * Math.sin(a), Math.sin(b)]; }
  function toLL(v) { return [Math.atan2(v[1], v[0]) * 180 / Math.PI, Math.asin(U.clamp(v[2], -1, 1)) * 180 / Math.PI]; }
  function slerp(a, b, t) {
    const d = U.clamp(a[0] * b[0] + a[1] * b[1] + a[2] * b[2], -1, 1); const om = Math.acos(d);
    if (om < 1e-4) return a;
    const s1 = Math.sin((1 - t) * om) / Math.sin(om), s2 = Math.sin(t * om) / Math.sin(om);
    return [a[0] * s1 + b[0] * s2, a[1] * s1 + b[1] * s2, a[2] * s1 + b[2] * s2];
  }
  V.drawGlobe = (ctx, W, H, t, I) => {
    ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, W, H);
    const R = Math.min(W, H) * 0.34, cx = W / 2, cy = H * 0.46;
    const lon0 = CENTER.lon + Math.sin(t * 0.06) * 55, lat0 = 12 * Math.PI / 180;
    const proj = (lon, lat, alt = 0) => {
      const l = (lon - lon0) * Math.PI / 180, b = lat * Math.PI / 180;
      const cosc = Math.sin(lat0) * Math.sin(b) + Math.cos(lat0) * Math.cos(b) * Math.cos(l);
      const r = R * (1 + alt);
      return { x: cx + r * Math.cos(b) * Math.sin(l), y: cy - r * (Math.cos(lat0) * Math.sin(b) - Math.sin(lat0) * Math.cos(b) * Math.cos(l)), z: cosc };
    };
    // atmosphere
    const at = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.5);
    at.addColorStop(0, rgba(C.accent, 0.18 + 0.12 * I)); at.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = at; ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#070b16'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    // land dots
    land().forEach((p) => { const q = proj(p.lon, p.lat); if (q.z <= 0) return; ctx.fillStyle = 'rgba(210,220,240,' + (0.08 + q.z * 0.35) + ')'; ctx.fillRect(q.x - 0.9, q.y - 0.9, 1.8, 1.8); });
    // arcs
    const cv = vec(CENTER.lon, CENTER.lat);
    ctx.globalCompositeOperation = 'lighter';
    NODES.forEach((n, i) => {
      const a = vec(n.lon, n.lat);
      ctx.strokeStyle = rgba(C.accent, 0.12 + 0.25 * I); ctx.lineWidth = 1;
      ctx.beginPath(); let started = false;
      for (let k = 0; k <= 40; k++) {
        const s = k / 40; const ll = toLL(slerp(a, cv, s)); const q = proj(ll[0], ll[1], Math.sin(s * Math.PI) * 0.18);
        if (q.z > -0.15) { if (!started) { ctx.moveTo(q.x, q.y); started = true; } else ctx.lineTo(q.x, q.y); } else started = false;
      }
      ctx.stroke();
      for (let k = 0; k < 3; k++) {
        const s = ((t * 0.07 + k / 3 + i * 0.11) % 1);
        const ll = toLL(slerp(a, cv, s)); const q = proj(ll[0], ll[1], Math.sin(s * Math.PI) * 0.18);
        if (q.z < -0.15) continue;
        const al = Math.sin(s * Math.PI);
        ctx.fillStyle = rgba(C.accent, 0.25 * al); ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = rgba('#ffffff', 0.9 * al); ctx.beginPath(); ctx.arc(q.x, q.y, 1.4, 0, TAU); ctx.fill();
      }
    });
    const c = proj(CENTER.lon, CENTER.lat);
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 50);
    g.addColorStop(0, rgba(C.accent, 0.8)); g.addColorStop(1, rgba(C.accent, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, 50, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // drifting motes
    for (let i = 0; i < 60; i++) {
      const x = (i * 97.3 + t * (4 + i % 5)) % W, y = (i * 53.7 + Math.sin(t * 0.2 + i) * 20 + H) % H;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + (i % 7) * 0.02) + ')'; ctx.fillRect(x, y, 1.2, 1.2);
    }
  };

  /* ---------------- fullscreen helpers ---------------- */

    const close = () => { el.classList.remove('in'); document.body.classList.remove('cinema-open'); setTimeout(() => el.remove(), 500); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };

    return el;

/* ==========================================================================
   achievements.js — badges, milestone celebrations, completion trigger
   ========================================================================== */
(function (M) {
  'use strict';
  const U = M.U;
  const H = 3600000;

  const DEFS = [
    { id: 'first-seed', name: 'First Seed', desc: 'Complete your first 10 minutes.', icon: 'seed', test: (s) => s.totalMs >= 10 * 60000 },
    { id: 'rooted', name: 'Rooted', desc: 'Complete 1 hour.', icon: 'drop', test: (s) => s.totalMs >= H },
    { id: 'first-harvest', name: 'First Harvest', desc: 'Complete 5 hours.', icon: 'gift', test: (s) => s.totalMs >= 5 * H },
    { id: 'deep-roots', name: 'Deep Roots', desc: 'Complete 10 hours.', icon: 'seed', test: (s) => s.totalMs >= 10 * H },
    { id: 'faithful', name: 'Faithful', desc: 'Pray 7 days in a row.', icon: 'flame', test: (s) => s.bestStreak >= 7 },
    { id: 'watchman', name: 'The Watchman', desc: 'Complete 25 hours.', icon: 'eye', test: (s) => s.totalMs >= 25 * H },
    { id: 'seeker', name: 'The Seeker', desc: 'Complete 40 hours.', icon: 'compass', test: (s) => s.totalMs >= 40 * H },
    { id: 'abundant', name: 'Abundant', desc: 'Complete 50 hours.', icon: 'sparkle', test: (s) => s.totalMs >= 50 * H },
    { id: 'sown-58', name: '58 Hours Sown', desc: 'Complete the entire journey.', icon: 'crown', test: (s) => s.goalsCompleted >= 1 },
    { id: 'altar', name: 'Altar Builder', desc: 'Complete 30 prayer sessions.', icon: 'flame', test: (s) => s.sessions >= 30 },
    { id: 'early', name: 'Early Seeker', desc: 'Complete 5 morning sessions (04:00–09:59).', icon: 'sun', test: (s) => s.morning >= 5 },
    { id: 'night', name: 'Night Watch', desc: 'Complete 5 night sessions (21:00–03:59).', icon: 'moon', test: (s) => s.night >= 5 },
    { id: 'consistent', name: 'Consistent', desc: 'Complete 14 consecutive days.', icon: 'calendar', test: (s) => s.bestStreak >= 14 }
  ];

  const MILESTONES_58 = [1, 5, 10, 20, 30, 40, 50, 55];
  const MSG = {
    1: 'The first hour has been sown.', 5: '5 hours have been sown.', 10: '10 hours have been sown.', 20: '20 hours have been sown.',
    30: '30 hours have been sown.', 40: '40 hours have been sown.', 50: '50 hours have been sown.', 55: '55 hours. The end of this season is in sight.'
  };

  const A = {
    DEFS,
    unlocked() { return M.state.achievements.unlocked; },
    /** Check badges; returns newly unlocked defs */
    check(silent) {
      const st = M.Analytics.stats();
      const u = M.state.achievements.unlocked; const fresh = [];
      DEFS.forEach((d) => { if (!u[d.id] && d.test(st)) { u[d.id] = Date.now(); fresh.push(d); } });
      if (fresh.length) {
        M.Storage.touch('achievements');
        if (!silent) fresh.forEach((d, i) => setTimeout(() => A.toast(d), 600 + i * 1600));
      }
      return fresh;
    },
    toast(d) {
      const host = U.$('#toasts'); if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast badge-toast'; el.setAttribute('role', 'status');
      el.innerHTML = `<span class="badge-ico sm">${U.icon(d.icon)}</span><span><strong>${U.esc(d.name)}</strong><br><span class="muted small">${U.esc(d.desc)}</span></span>`;
      host.appendChild(el); requestAnimationFrame(() => el.classList.add('in'));
      setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 400); }, 4200);
    },

    /** Milestone thresholds (hours) for a goal, scaled for non-58 goals */
    thresholds(goal) {
      if (!M.Goals.isTimeBased(goal)) return [];
      if (+goal.target === 58) return MILESTONES_58;
      const T = +goal.target;
      return [0.02, 0.1, 0.25, 0.5, 0.75, 0.9].map((f) => Math.max(1, Math.round(T * f))).filter((v, i, a) => a.indexOf(v) === i && v < T);
    },
    /**
     * Compare progress before/after a change. Shows the highest newly crossed
     * milestone (one celebration at a time) or the completion experience.
     */
    afterProgress(goal, beforeMs, afterMs, beforeP, afterP) {
      const meta = M.state.meta;
      meta.milestones[goal.id] = meta.milestones[goal.id] || [];
      const shown = meta.milestones[goal.id];
      if (!beforeP.complete && afterP.complete && !meta.completedGoals[goal.id]) {
        meta.completedGoals[goal.id] = Date.now(); M.Storage.touch('meta');
        A.check();
        setTimeout(() => M.Viz.completion(goal), 400);
        return 'complete';
      }
      if (!M.Goals.isTimeBased(goal)) return null;
      const crossed = A.thresholds(goal).filter((h) => beforeMs < h * H && afterMs >= h * H && !shown.includes(h));
      if (crossed.length) {
        const h = crossed[crossed.length - 1];
        crossed.forEach((x) => shown.push(x)); M.Storage.touch('meta');
        setTimeout(() => M.Viz.celebrate(h + (h === 1 ? ' HOUR' : ' HOURS'), MSG[h] && +goal.target === 58 ? MSG[h] : h + ' hours have been sown.', afterP.pct), 400);
        return 'milestone';
      }
      return null;
    },

    render(root) {
      const u = A.unlocked();
      const n = Object.keys(u).length;
      root.innerHTML = `
        <header class="view-head">
          <p class="eyebrow">Achievements</p>
          <h1 class="view-title">${n ? n + ' of ' + DEFS.length + ' earned' : 'The journey has just begun.'}</h1>
          <p class="lede">Markers along the way — not the destination. The destination is God Himself.</p>
        </header>
        <section class="badge-grid">
          ${DEFS.map((d) => `<article class="badge ${u[d.id] ? 'earned' : 'locked'}" aria-label="${U.esc(d.name)} ${u[d.id] ? 'earned' : 'locked'}">
            <span class="badge-ico">${U.icon(u[d.id] ? d.icon : 'lock')}</span>
            <h3 class="badge-name">${U.esc(d.name)}</h3>
            <p class="muted small">${U.esc(d.desc)}</p>
            <p class="badge-state small">${u[d.id] ? 'Earned ' + U.fmtDate(u[d.id], { month: 'short', day: 'numeric', year: 'numeric' }) : 'Not yet'}</p>
          </article>`).join('')}
        </section>`;
    }
  };

  M.Achievements = A;
})(window.MDT = window.MDT || {});

/* ===== js/analytics.js ===== */
/* ==========================================================================
   analytics.js — statistics, streaks, projections and SVG charts
   ========================================================================== */
(function (M) {
  'use strict';
  const U = M.U;
  const H = 3600000;

  function dayTotals(sessions) {
    const map = new Map();
    sessions.forEach((s) => { const k = U.dayKey(s.start); map.set(k, (map.get(k) || 0) + s.durationMs); });
    return map;
  }
  function streaks(keys) {
    const set = new Set(keys);
    let cur = 0; let d = Date.now();
    if (!set.has(U.dayKey(d))) d = U.addDays(d, -1);
    while (set.has(U.dayKey(d))) { cur++; d = U.addDays(d, -1); }
    const sorted = Array.from(set).sort();
    let best = 0, run = 0, prev = null;
    sorted.forEach((k) => {
      const [y, m, dd] = k.split('-').map(Number); const ts = new Date(y, m - 1, dd).getTime();
      run = prev != null && Math.round((ts - prev) / U.DAY) === 1 ? run + 1 : 1;
      best = Math.max(best, run); prev = ts;
    });
    return { current: cur, best: Math.max(best, cur) };
  }

  const A = {
    dayTotals,
    stats() {
      const ss = M.Storage.getSessions();
      const totalMs = ss.reduce((a, s) => a + s.durationMs, 0);
      const days = dayTotals(ss);
      const st = streaks(Array.from(days.keys()));
      let morning = 0, night = 0, longest = 0;
      ss.forEach((s) => { const h = new Date(s.start).getHours(); if (h >= 4 && h < 10) morning++; if (h >= 21 || h < 4) night++; longest = Math.max(longest, s.durationMs); });
      return {
        totalMs, sessions: ss.length, morning, night, longestMs: longest, avgSessionMs: ss.length ? totalMs / ss.length : 0,
        currentStreak: st.current, bestStreak: st.best, activeDays: days.size,
        goalsCompleted: Object.keys(M.state.meta.completedGoals || {}).length
      };
    },
    summary() { const s = A.stats(); const g = M.Goals.active(); const p = M.Goals.progress(g); return Object.assign({}, s, { activeGoal: g.name, activeGoalPct: Math.round(p.pct * 1000) / 10 }); },
    todayMs(extra = 0) { const k = U.dayKey(Date.now()); return M.Storage.getSessions().filter((s) => U.dayKey(s.start) === k).reduce((a, s) => a + s.durationMs, 0) + extra; },
    todaySessions() { const k = U.dayKey(Date.now()); return M.Storage.getSessions().filter((s) => U.dayKey(s.start) === k); },

    /** Projected completion for the active goal based on actual pace */
    projection(goal) {
      goal = goal || M.Goals.active();
      const ss = M.Storage.getSessions(goal.id);
      const p = M.Goals.progress(goal);
      if (p.complete) return { complete: true, p };
      if (!M.Goals.isTimeBased(goal)) {
        if (ss.length < 3) return null;
        const first = U.startOfDay(ss[0].start);
        const span = Math.max(1, Math.round((U.startOfDay(Date.now()) - first) / U.DAY) + 1);
        const perDay = p.value / span; if (perDay <= 0) return null;
        const days = Math.ceil((p.target - p.value) / perDay);
        return { p, perDayLabel: (Math.round(perDay * 10) / 10) + ' ' + M.Goals.unitLabel(goal) + '/day', days, weeks: days / 7, date: U.addDays(Date.now(), days) };
      }
      if (ss.length < 3) return null;
      const first = U.startOfDay(ss[0].start);
      const span = Math.round((U.startOfDay(Date.now()) - first) / U.DAY) + 1;
      if (span < 2) return null;
      const perDay = p.doneMs / span;
      if (perDay < 60000) return null;
      const days = Math.ceil(p.remainingMs / perDay);
      return { p, perDay, perDayLabel: U.hm(perDay) + '/day', days, weeks: days / 7, date: U.addDays(Date.now(), days) };
    },

    /* ---------------- charts (inline SVG, theme-token colors) ---------------- */
    weekBars(targetMs) {
      const now = new Date(); const dow = (now.getDay() + 6) % 7; // Monday=0
      const monday = U.startOfDay(U.addDays(Date.now(), -dow));
      const totals = dayTotals(M.Storage.getSessions());
      const days = Array.from({ length: 7 }, (_, i) => { const ts = U.addDays(monday, i); return { ts, ms: totals.get(U.dayKey(ts)) || 0, today: i === dow, future: i > dow }; });
      const max = Math.max(targetMs || 0, ...days.map((d) => d.ms), H);
      const W = 560, Ht = 200, pad = 28, bw = (W - pad * 2) / 7;
      const y = (v) => Ht - 30 - (v / max) * (Ht - 60);
      const ty = targetMs ? y(targetMs) : null;
      return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Prayer time this week">
        ${ty != null ? `<line x1="${pad}" x2="${W - pad}" y1="${ty}" y2="${ty}" class="c-target"/><text x="${W - pad}" y="${ty - 5}" class="c-label" text-anchor="end">Daily target ${U.hm(targetMs)}</text>` : ''}
        <line x1="${pad}" x2="${W - pad}" y1="${Ht - 30}" y2="${Ht - 30}" class="c-axis"/>
        ${days.map((d, i) => {
          const x = pad + i * bw + bw * 0.22, w = bw * 0.56, yy = y(d.ms), h = Ht - 30 - yy;
          const met = targetMs && d.ms >= targetMs;
          return `<g><title>${U.fmtDate(d.ts, { weekday: 'long' })}: ${U.hm(d.ms)}</title>
            <rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0, h)}" rx="3" class="c-bar ${d.today ? 'today' : ''} ${met ? 'met' : ''}"/>
            ${d.ms ? `<text x="${x + w / 2}" y="${yy - 6}" class="c-val" text-anchor="middle">${U.hm(d.ms)}</text>` : ''}
            <text x="${x + w / 2}" y="${Ht - 12}" class="c-label ${d.today ? 'strong' : ''}" text-anchor="middle">${U.fmtDate(d.ts, { weekday: 'short' })}</text></g>`;
        }).join('')}
      </svg>`;
    },
    cumulative(goal) {
      const ss = M.Storage.getSessions(goal.id);
      const W = 560, Ht = 200, padL = 36, padR = 16, padT = 16, padB = 28;
      if (!ss.length) return '<div class="empty small"><p class="muted">Your cumulative line appears after your first session.</p></div>';
      const start = U.startOfDay(Math.min(ss[0].start, Date.now()));
      const end = U.startOfDay(Date.now());
      const nDays = Math.max(1, Math.round((end - start) / U.DAY) + 1);
      const totals = dayTotals(ss);
      let acc = 0; const pts = [];
      for (let i = 0; i < nDays; i++) { acc += totals.get(U.dayKey(U.addDays(start, i))) || 0; pts.push(acc / H); }
      const maxV = Math.max(goal.target * 0.25, ...pts) * 1.1;
      const x = (i) => padL + (nDays === 1 ? (W - padL - padR) : i / (nDays - 1) * (W - padL - padR));
      const y = (v) => Ht - padB - v / maxV * (Ht - padT - padB);
      const line = pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
      const area = line + ` L${x(nDays - 1)} ${Ht - padB} L${x(0)} ${Ht - padB} Z`;
      const ticks = [0, 0.5, 1].map((f) => Math.round(maxV * f));
      return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Cumulative hours sown">
        ${ticks.map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" class="c-grid"/><text x="${padL - 6}" y="${y(v) + 4}" class="c-label" text-anchor="end">${v}h</text>`).join('')}
        <path d="${area}" class="c-area"/><path d="${line}" class="c-line"/>
        <circle cx="${x(nDays - 1)}" cy="${y(pts[pts.length - 1])}" r="4" class="c-dot"/>
        <text x="${x(nDays - 1)}" y="${y(pts[pts.length - 1]) - 10}" class="c-val" text-anchor="end">${U.hm(acc)}</text>
        <text x="${padL}" y="${Ht - 8}" class="c-label">${U.fmtDate(start, { month: 'short', day: 'numeric' })}</text>
        <text x="${W - padR}" y="${Ht - 8}" class="c-label" text-anchor="end">Today</text>
      </svg>`;
    },
    heatmap(weeks = 18) {
      const totals = dayTotals(M.Storage.getSessions());
      const target = M.Goals.dailyTargetMs(M.Goals.active());
      const today = U.startOfDay(Date.now());
      const dow = (new Date().getDay() + 6) % 7;
      const start = U.addDays(today, -(weeks - 1) * 7 - dow);
      const cell = 13, gap = 3, W = weeks * (cell + gap) + 30, Ht = 7 * (cell + gap) + 20;
      let cells = '';
      for (let w = 0; w < weeks; w++) {
        for (let d = 0; d < 7; d++) {
          const ts = U.addDays(start, w * 7 + d); if (ts > today) continue;
          const ms = totals.get(U.dayKey(ts)) || 0;
          const lvl = ms === 0 ? 0 : ms < target * 0.25 ? 1 : ms < target * 0.6 ? 2 : ms < target ? 3 : 4;
          cells += `<rect x="${30 + w * (cell + gap)}" y="${d * (cell + gap)}" width="${cell}" height="${cell}" rx="3" class="hm l${lvl}"><title>${U.fmtDate(ts, { weekday: 'short', month: 'short', day: 'numeric' })}: ${ms ? U.hm(ms) : 'no prayer logged'}</title></rect>`;
        }
      }
      const labels = ['Mon', '', 'Wed', '', 'Fri', '', 'Sun'].map((l, d) => l ? `<text x="0" y="${d * (cell + gap) + 10}" class="c-label">${l}</text>` : '').join('');
      return `<div class="hscroll"><svg class="heatmap" viewBox="0 0 ${W} ${Ht}" style="min-width:${Math.min(W, 520)}px" role="img" aria-label="Daily prayer heatmap, last ${weeks} weeks">${labels}${cells}</svg></div>
        <div class="hm-legend small muted"><span>Less</span>${[0, 1, 2, 3, 4].map((l) => `<svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="3" class="hm l${l}"/></svg>`).join('')}<span>More · relative to your daily target</span></div>`;
    },
    monthBars() {
      const totals = dayTotals(M.Storage.getSessions());
      const today = U.startOfDay(Date.now());
      const days = Array.from({ length: 30 }, (_, i) => { const ts = U.addDays(today, i - 29); return { ts, ms: totals.get(U.dayKey(ts)) || 0 }; });
      const max = Math.max(H, ...days.map((d) => d.ms));
      const W = 560, Ht = 120, bw = (W - 20) / 30;
      return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Last 30 days">
        <line x1="10" x2="${W - 10}" y1="${Ht - 22}" y2="${Ht - 22}" class="c-axis"/>
        ${days.map((d, i) => { const h = d.ms / max * (Ht - 40); return `<rect x="${10 + i * bw + 1.5}" y="${Ht - 22 - h}" width="${bw - 3}" height="${h}" rx="2" class="c-bar ${i === 29 ? 'today' : ''}"><title>${U.fmtDate(d.ts)}: ${U.hm(d.ms)}</title></rect>`; }).join('')}
        <text x="10" y="${Ht - 6}" class="c-label">${U.fmtDate(days[0].ts, { month: 'short', day: 'numeric' })}</text>
        <text x="${W - 10}" y="${Ht - 6}" class="c-label" text-anchor="end">Today</text>
      </svg>`;
    },
    ring(pct, size = 220, stroke = 10, label = '') {
      const r = (size - stroke) / 2, c = 2 * Math.PI * r;
      return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${U.esc(label || Math.round(pct * 100) + '% complete')}">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" class="ring-track" stroke-width="${stroke}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" class="ring-fill" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - U.clamp(pct, 0, 1))}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      </svg>`;
    },

    /* ---------------- view ---------------- */
    render(root) {
      const s = A.stats();
      const g = M.Goals.active();
      const p = M.Goals.progress(g);
      const proj = A.projection(g);
      const tgt = M.Goals.dailyTargetMs(g);
      const weekMs = (() => { const dow = (new Date().getDay() + 6) % 7; const mon = U.startOfDay(U.addDays(Date.now(), -dow)); return M.Storage.getSessions().filter((x) => x.start >= mon).reduce((a, x) => a + x.durationMs, 0); })();
      const firstTs = M.Storage.getSessions()[0];
      const spanDays = firstTs ? Math.round((U.startOfDay(Date.now()) - U.startOfDay(firstTs.start)) / U.DAY) + 1 : 0;
      const consistency = spanDays ? Math.round(s.activeDays / spanDays * 100) : 0;
      root.innerHTML = `
        <header class="view-head"><p class="eyebrow">Analytics</p><h1 class="view-title">The rhythm you are building.</h1></header>
        <section class="grid-2">
          <article class="panel">
            <div class="row between center"><h2 class="h3">This week</h2><span class="tnum muted">${U.hm(weekMs)}</span></div>
            ${A.weekBars(tgt)}
          </article>
          <article class="panel">
            <div class="row between center"><h2 class="h3">Cumulative — ${U.esc(g.name)}</h2><span class="tnum muted">${Math.floor(p.pct * 100)}%</span></div>
            ${A.cumulative(g)}
          </article>
        </section>
        <section class="stat-strip">
          ${tile('Average session', s.sessions ? U.hm(s.avgSessionMs) : '—')}
          ${tile('Sessions', s.sessions)}
          ${tile('Longest session', s.sessions ? U.hm(s.longestMs) : '—')}
          ${tile('Current streak', s.currentStreak + (s.currentStreak === 1 ? ' day' : ' days'))}
          ${tile('Best streak', s.bestStreak + (s.bestStreak === 1 ? ' day' : ' days'))}
          ${tile('Consistency', spanDays ? consistency + '%' : '—', spanDays ? s.activeDays + ' of ' + spanDays + ' days' : '')}
        </section>
        <section class="panel">${A.projectionHTML(proj, g)}</section>
        <section class="panel"><div class="row between center"><h2 class="h3">Last 30 days</h2></div>${A.monthBars()}</section>
        <section class="panel"><h2 class="h3">Daily heatmap</h2>${A.heatmap()}</section>`;
      function tile(k, v, sub) { return `<div class="stat"><p class="stat-k">${k}</p><p class="stat-v tnum">${v}</p>${sub ? `<p class="muted small">${sub}</p>` : ''}</div>`; }
    },
    projectionHTML(proj, g) {
      if (proj && proj.complete) return `<p class="eyebrow">Projected completion</p><p class="proj-date">Completed.</p><p class="muted">Now walk in what you have received.</p>`;
      if (!proj) return `<p class="eyebrow">Projected completion</p><p class="proj-empty">Keep sowing. Your completion date will appear as your rhythm becomes established.</p>`;
      const rem = M.Goals.isTimeBased(g) ? (() => { const t = Math.floor(proj.p.remainingMs / 60000); return `${Math.floor(t / 60)} <small>hours</small> ${t % 60} <small>minutes</small>`; })() : M.Goals.fmtRemaining(proj.p);
      return `<p class="eyebrow">Projected completion</p>
        <p class="muted">You are currently averaging <strong class="accent-text">${proj.perDayLabel}</strong>.</p>
        <p class="proj-date">${U.fmtDate(proj.date, { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase()}</p>
        <div class="proj-grid">
          <div><p class="stat-k">Time remaining</p><p class="stat-v tnum">${rem}</p></div>
          <div><p class="stat-k">Days remaining</p><p class="stat-v tnum">${proj.days}</p></div>
          <div><p class="stat-k">Weeks remaining</p><p class="stat-v tnum">${(Math.round(proj.weeks * 10) / 10).toFixed(1)}</p></div>
        </div>
        <p class="muted small">An estimate from your actual pace, recalculated after every session.</p>`;
    }
  };

  M.Analytics = A;
})(window.MDT = window.MDT || {});

/* ===== js/vision.js ===== */
/* ==========================================================================
   vision.js — The Vision Account
   ---------------------------------------------------------------------------
   Money from the nations, in their own currencies, piling up as prayer time
   grows. Everything is derived from the time you have sown:

       vision value = total prayer time × (target amount ÷ target hours)

   so the balance rises only while you are with God, and in real time while
   the timer runs. Inflows (city, currency, kind, amount) are generated
   deterministically from each 5-minute block of prayer, so the feed is the
   same on every device and every reload.

   Exchange rates are fixed approximations used for the vision display only.
   Actual money you receive is recorded separately in the Real provision log.
   ========================================================================== */
(function (M) {
  'use strict';
  const U = M.U;
  const BLOCK = 5 * 60000;

  // Units of XAF (FCFA) per 1 unit of each currency — approximate, fixed.
  const FX = { XAF: 1, USD: 605, EUR: 655.957, GBP: 765, CAD: 445, AUD: 400, CHF: 690, JPY: 4.1, CNY: 84, INR: 7.3, SGD: 450, KRW: 0.45, AED: 165, SAR: 161, QAR: 166, NGN: 0.39, KES: 4.7, ZAR: 33, GHS: 41, BRL: 110, MXN: 33, COP: 0.15 };
