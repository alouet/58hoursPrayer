  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<!--APP-->
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" aria-label="Money Doesn’t Deserve My Time — home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M20 31V19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M20 21c-5 0-8-3.5-8-8 5 0 8 3.5 8 8zM20 19c0-5 3.5-8 8-8 0 5-3.5 8-8 8z" fill="currentColor"/></svg>
        <span class="brand-text"><span class="brand-name">Money Doesn’t Deserve My Time<sup>™</sup></span><span class="brand-sub">58 hours of seeking God</span></span>
      </a>
      <nav id="sidenav" class="sidenav"></nav>
      <p class="sidebar-motto">My time is for God.<br>My energy is for purpose.<br>My resources are for impact.</p>
    </aside>

    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <a class="brand compact" href="#dashboard" aria-label="Home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M20 31V19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M20 21c-5 0-8-3.5-8-8 5 0 8 3.5 8 8zM20 19c0-5 3.5-8 8-8 0 5-3.5 8-8 8z" fill="currentColor"/></svg>
      </a>
      <span class="goal-chip" id="goal-chip">58 Hours With God</span>
      <span class="topbar-spacer"></span>
      <button class="sync-status" id="sync-status" data-state="local" aria-label="Sync status"><span class="sync-dot" aria-hidden="true"></span><span class="sync-label">Saved on this device</span></button>
      <button class="icon-btn" id="mode-btn" aria-label="Toggle light and dark mode"></button>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="boot"><p class="eyebrow">58 hours with God</p><p class="boot-line">I am here to sow.</p></div>
    </main>

    <nav id="bottomnav" class="bottomnav" aria-label="Primary"></nav>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-scrim" data-drawer-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="row between center"><p class="eyebrow">Menu</p><button class="icon-btn" data-drawer-close aria-label="Close menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <nav id="drawer-nav" class="sidenav"></nav>
    </div>
  </div>

  <div id="live-pill" class="live-pill" role="button" tabindex="0" aria-label="Return to the prayer room" hidden>
    <span class="lp-dot" aria-hidden="true"></span><span class="lp-state">Sowing</span><span class="lp-time tnum">00:00:00</span>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">This app needs JavaScript to run.</p></noscript>
<!--/APP-->
